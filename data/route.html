"],"content":"\"Stuff for Nintendo,\" says <<print $friend>>.\n\n[[\"Does Nintendo have a lot of business here?\"]]\n[[\"What does Nintendo do here?\"|\"Then what does he have to do here?\"]]\n[[\"Oh, okay.\"|EndConvo]]"},{"id":"\"How are your parents doing?\"","x":4080,"y":1011,"cat":"den","out":2,"tags":["Den"],"content":"\"What are you talking about?\" asks <<print $friend>>.  \"They're fine, I guess?  How's your mom?\"\n\n[[\"She's good.  I wish she didn't have to work so late all the time.\"]]\n<<if $beer eq \"yes\">>\\s\n[[\"Listen, I know this will sound weird, but at dinner I thought I saw your dad drinking a beer...|\"But you see, earlier at dinner I saw your dad drinking a beer...\"]]\n<<endif>>"},{"id":"\"I... I'm not sure.\"","x":4080,"y":1308,"cat":"den","out":1,"tags":["Den"],"content":"<<playsound $thunder>>Thunder rumbles and <<print $friend>>'s demeanor changes.  You watch as <<print $pron>> suddenly looks around the room, as if expecting someone to be there.\n\n\"Never mind,\" <<print $pron>> says.  \"Just forget I said anything.\"\n\nAs <<print $pron>> goes back to playing <<print $posspron>> game, you can't help but wonder [[what just happened|TimePasses]]."},{"id":"answered the door","x":4980,"y":1308,"cat":"vague","out":1,"tags":["vague2"],"content":"\"We fought sometimes,\" says <<print $friend>>, \"but I wonder sometimes, you know, if he'd answered the door instead of me, would he have eventually done what I did?  What I did to him?\"\n\n[[\"What are you talking about?\"]]\n[[\"What did you do?\"|\"What are you talking about?\"]]"},{"id":"Weird2","x":5430,"y":2199,"cat":"kitchen","out":2,"tags":["Kitchen"],"content":"\"What?  What do you mean?\"\n\n<<if $fight eq \"yes\">>\\s\n[[\"I got in a fight with <<print $friend>>.\"|Fight2]]\n<<endif>>\\s\n[[\"I just want to go home, Mom, please?\"|Home4]]"},{"id":"\"What's wrong?\"","x":2820,"y":1011,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> shakes <<print $posspron>> head.  \"No, sorry, I just... I was just thinking.\"\n\nYou shrug and then pick a cartridge from the pile.  \"How about this one?\"\n\n<<print $friend>> nods.  As you plug it in and start up the console you hear <<print $dopron>> behind you: \"Hey.\"\n\n[[\"Yeah?\"|\"Hm?\"]]\n[[\"Hm?\"]]"},{"id":"Debug.","x":1920,"y":813,"cat":"default","out":1,"tags":["minimal"],"content":"<<print JSON.stringify(state.history[0].variables)>>\n\n[[back|DenHub]]"},{"id":"\"Hi, Mom.\"","x":1290,"y":2397,"cat":"kitchen","out":3,"tags":["Kitchen"],"content":"\"Honey,\" she says, \"I'm busy.  You shouldn't just be calling me at work whenever you want.  Is everything okay?\"\n\n[[\"I want to go home.\"]]\n[[\"No, it's not okay!\"|\"Things are really weird here!\"]]\n[[\"I just wanted to talk, I guess.\"|EndCall]]"},{"id":"\"So what happened?\"","x":4980,"y":1506,"cat":"den","out":3,"tags":["Den"],"content":"<<print $friend>> won't look at you.  \"I told my uncle to get rid of him, and he did.\"\n<<set $distress = $distress+1>>\n[[\"You're kidding, right?\"]]\n[[\"What did he do?\"]]\n[[\"I want to go home.\"|GoingHome2]]"},{"id":"into the rain","x":5790,"y":3288,"cat":"default","out":1,"tags":["HouseOutsideNight"],"content":"The sitter's familiar car is parked out front.\n\nAs you walk closer, you see your little sister in the back seat, still in her pajamas.  The sitter, a high school girl who lives down the street from you, looks incredibly unhappy to be here, but you think you'll be able to handle her.\n\nAs you climb into the car you cast one last look over your shoulder, [[back to the house|BackHouse1]]."},{"id":"Go home","x":2640,"y":2892,"cat":"ending","out":1,"tags":["HouseEmpty"],"content":"You never see <<print $friend>> again, and eventually, as the years pass, you forget about <<print $dopron>> entirely.\n<<set $escape = \"yes\">>\n[[END]]"},{"id":"Run","x":3720,"y":3189,"cat":"vague","out":1,"tags":["vague4"],"content":"You tried to hide, but t̙̳̙h̙̦̙e̙̙͊ ̙̙̃u̙̙̿n̵̙̙c̡̙̙l̙̮̙e̙̺̙ ̙̙ͨw̙͍̙h̙̬̙ö̙̙ ̙̹̙w̙̙̑o̙̙͡r̙̙̎k̙̙̓s̙̙ͤ ̙foṟ̙ ̙̙ͫN̙᷊̙i̙̙͝n̙̙̒t̙̗̙e̵̙̙n̙͎̙d̙͖̙o̙͙̙ found you.\n\n[[Back|credits]]."},{"id":"closet","x":1290,"y":813,"cat":"bathroom","out":1,"tags":["Bathroom"],"content":"It's a linen closet, filled with large fluffy towels and wash cloths.  You're not sure why you looked in here.\n\n[[Are you finished?|Bathroom1]]"},{"id":"Look for pictures of <<print $friend>>'s uncle","x":2100,"y":2001,"cat":"den","out":1,"tags":["Den"],"content":"You don't find any.  Not one.  The only pictures here are of <<print $friend>> and <<print $posspron>> parents.\n<<set $distress = $distress+1>>\n[[You don't know why that makes you feel uneasy|TimePasses]]."},{"id":"EndGame1","x":3450,"y":1902,"cat":"glitch","out":1,"tags":["KitchenGlitch"],"content":"It falls silent for the moment.  It has grown weak since you haven't been feeding it.\n\n[[Take out the Gameboy]]."},{"id":"three rings","x":1290,"y":2298,"cat":"kitchen","out":3,"tags":["Kitchen"],"content":"[[\"Hi, Mom.\"]]\n[[\"I want to go home.\"]]\n[[\"Things are really weird here!\"]]"},{"id":"(Comfort.)","x":4170,"y":1605,"cat":"den","out":1,"tags":["Den"],"content":"[[\"It's okay, please calm down.\"|Forbid]]\n[[\"It'll be okay, <<print $friend>>. Just tell me what's wrong.\"|Forbid]]"},{"id":"EndConvo","x":1740,"y":1308,"cat":"den","out":1,"tags":["Den"],"content":"You drop the [[conversation in silence|DenHub]]."},{"id":"Play2","x":3090,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"This game is kind of spooky.  Your character just has a flashlight and is running around in some underground tunnels.  Occasionally you hear what sounds like digging.\n<<set $distress = $distress+1>>\nYou don't like it.\n\n<<print $friend>> is watching you, and seems to be amused at how uncomfortable you are.\n\nYou don't say anything, so you don't look weak.  You play for a [[while, even though there doesn't seem to be an ending|TimeIncrement]]."},{"id":"Play1","x":2730,"y":813,"cat":"den","out":1,"tags":["Den"],"content":"In this game, you play as a warrior saving a magical kingdom of talking animals from an old wizard who barfs up blood every time he talks.\n\nIt's gross, but also sort of funny.\n\n\"You're pretty good at this one,\" says <<print $friend>>, and then adds, <<print $posspron>> voice a little low, \"I never actually beat it.\"\n\n[[You play for a while|TimeIncrement]]."},{"id":"cracks a beer","x":1200,"y":417,"cat":"default","out":1,"tags":[],"content":"Wait, that wasn't a beer at all.  That's a glass of lemonade.\n\nWhy would you even think it was a beer?  <<print $friend>>'s father doesn't drink alcohol.  You're quite certain of that fact, now that you've remembered it.\n\n[[Well, whatever.|DinnerTime]]\n<<set $beer = \"yes\">>"},{"id":"\"I don't think we're friends anymore.\"","x":930,"y":3090,"cat":"den","out":1,"tags":["Den"],"content":"\"You don't understand,\" <<print $pron>> says.  \"If you leave I'll get in trouble...\"\n\n[[\"So what?\"|\"Trouble?\"]]\n[[\"Trouble?\"]]"},{"id":"...you involuntarily flinch.","x":1470,"y":1605,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> shakes <<print $posspron>> head, as if remembering something.\n\n\"Never mind,\" <<print $pron>> says.  \"Just never mind.\"\n<<set $business = \"yes\">>\nYou want to say something more, but <<print $pron>> is already reimmersed in the videogame.\n<<set $sad = \"yes\">>\n[[You take a breather|DenHub]]."},{"id":"On Author's Notes","x":3900,"y":3486,"cat":"default","out":2,"tags":[],"content":"There are several endings to this game and yet, if you are reading this, it's because you've attained the ending after which I do not think there can be any more \"play.\"\n\nIf you haven't unlocked all the endings and were planning to do so, I'm sorry for what probably seems to be a blunder in design.\n\nAlternatively, you can read the short essays that follow, since their appearance here was definitely an intended effect of the design.  They are various reflections I composed for my own clarification and guidance while making and testing this game.\n\nThey are likely tedious and, to greater or lesser degrees, beside the point of whatever experience you had while playing the game, but that is why they are \"hidden content.\"\n\nNevertheless, if you would like more traditional hidden content, please click [[here|alt-outfits]]. \n\nAnd at any rate, thanks for playing.\n\n[[Back|the author's notes]]."},{"id":"closetHide","x":3900,"y":2298,"cat":"glitch","out":1,"tags":["BathroomGlitch"],"content":"You crawl into the plain white box that is about the size of a linen closet, and close it behind you.  From the front of the house, you can hear the [[front door slam open]].<<unloopsound $knock>>"},{"id":"\"So was I hallucinating that thing with your parents?\"","x":3990,"y":1011,"cat":"den","out":2,"tags":["Den"],"content":"\"Of course you were,\" says <<print $friend>>.  \"You weirdo.\"\n\n[[\"But the thing is, I saw them...\"]]\n<<if $beer eq \"yes\">>\\s\n[[\"But you see, earlier at dinner I saw your dad drinking a beer...\"]]\n<<endif>>"},{"id":"\"I... yeah... yeah, I know what you mean.\"","x":3900,"y":318,"cat":"den","out":2,"tags":["Den"],"content":"[[\"They say the same stuff about me.\"|SchoolDudes]]\n[[\"Everyone says it's weird that I'm friends with you.\"]]"},{"id":"NVM","x":3900,"y":1407,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> shakes <<print $posspron>> head.  \"Never mind,\" <<print $pron>> says.  \"Never mind, it's not a problem now...\"\n\nYou grow more uneasy after this exchange.\n<<set $distress = $distress+1>>\n[[What else is there to talk about?|Talk to <<print $friend>>]]"},{"id":"can't even see the house's lights","x":2460,"y":2793,"cat":"vague","out":1,"tags":["vague3"],"content":"<<print $friend>> doesn't show up at school on [[Monday]]."},{"id":"When they what?","x":4080,"y":1209,"cat":"den","out":2,"tags":["Den"],"content":"<<stopsound $tick>>\\s\n<<stopsound $ambient>>\"When they aren't around for you,\" says <<print $friend>>.  After a moment <<print $pron>> looks at you straight on, and you are surprised by how incredibly sad <<print $pron>> looks.\n\n\"You remember that things weren't always like this, right?\" <<print $pron>> asks you.  \"You //do// remember?\"\n\n[[\"I... I'm not sure.\"]]\n[[\"No.  What are you talking about?\"|\"I... I'm not sure.\"]]\n<<if $house eq \"yes\">>[[\"I remember... you used to live next door to me.\"]]<<endif>>"},{"id":"around midnight","x":2460,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"For the first time <<print $friend>> stops playing <<print $posspron>> game, stops eating popcorn, and turns to look at <<print $posspron>> mother.  \"Okay,\" <<print $pron>> says.\n\n\"I want you two to welcome him in.  He'll be very tired and very hungry, so offer him something to eat before he goes to bed.\"\n\n\"Okay, mom.\"\n<<set $popcorn = \"yes\">>\n\"Goodnight, kids.\"  And with that, [[she's gone|DenHub]]."},{"id":"Bathroom1","x":1290,"y":912,"cat":"bathroom","out":7,"tags":["Bathroom"],"content":"<<stopsound $tick>><<stopsound $ambient>><<if ($time gte 10) and ($snack eq \"yes\") and ($distress gte 3)>>You head to the bathroom down the hall from the den.  There's a [[shower|shower1]], a [[linen closet|closet1]], and a [[toilet|toilet1]].<<set $distress = $distress+1>><<else>>You head to the bathroom down the hall from the den.  There's a [[shower]], a [[linen closet|closet]], and a [[toilet|toilet]].<<endif>>\n\n[[Go back|ToTheDen]]."},{"id":"Ask about uncle's visit","x":1650,"y":1011,"cat":"den","out":2,"tags":["Den"],"content":"[[\"So why is your uncle coming?\"]]\n[[\"Your uncle stays with you when he visits?\"]]"},{"id":"Sorry1","x":5790,"y":2199,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"\"Just don't call again unless it's an emergency, okay?\"\n\nAnd with that, she hangs up.\n\n[[You head back|ToTheDen]]."},{"id":"NoTime","x":3630,"y":1605,"cat":"gameboy","out":1,"tags":["Gameboy"],"content":"This isn't the time to use that!\n\n[[Back|START]]."},{"id":"running and hiding","x":3630,"y":2199,"cat":"den","out":2,"tags":["Den"],"content":"Where is there to go?\n<<playsound $vgloopGLITCH>>\n[[Run to the bathroom|BathroomHide]].\n<<if $kitchglitch eq \"yes\">><p style=\"color: #000000\"><span style=\"background-color:salmon\">[[Run to the kitchen|KitchenGlitch]].</span></p><<else>>[[Run to the kitchen|KitchenGlitch]].<<endif>>"},{"id":"\"I know about the uncle.\"","x":3990,"y":1803,"cat":"glitch","out":1,"tags":["DenGlitch"],"content":"<<print $friend>> blinks uneasily at you.  \"I don't know what \n<<loopsound $Tirade>>\n<<set \n\nD̯ͩͩOͩ͒ͩ ͩͩ͞N͖ͩͩO̪ͩͩTͩͦͩ ͩ̿ͩL̨͈̣ͩͩͩͩḬͩͩSͩ͆ͩṰͩͩE̱ͩͩN͇ͩͩ>>\n\nyou mean.  What are you talking about?\"\n\n[[\"I used it to come back here.\"]]"},{"id":"Plan","x":3450,"y":1605,"cat":"gameboy","out":2,"tags":["Gameboy"],"content":"You hope [[this works]].\n\n[[Back|START]]."},{"id":"Restart at 7:00 in the den","x":3450,"y":3387,"cat":"default","out":1,"tags":[],"content":"One quick question, then: was your friend's father drinking beer at dinner?\n\n[[No, he doesn't drink|DenHub][$beer = \"no\"]].\n[[I'm not sure what I saw|DenHub][$beer = \"yes\"]].\n<<silently>><<set $time = 7>><<endsilently>>"},{"id":"\"It's weak.\"","x":4440,"y":1803,"cat":"glitch","out":1,"tags":["DenGlitch"],"content":"<<timedinsert 2s>><<set I̸ ̸A̸M̸ ̸N̸O̸T̸>><<endtimedinsert>>\"But it changed so much,\" says <<print $friend>>.\n\n[[\"Not really.\"|\"It lies. It always lies.\"]]\n<<timedinsert 4s>><<set \n\nC̵͋͋H͋̍͋I̪͋͋Ḽ͋͋D̜͋͋ ̵͋͋I̱͋͋ ͋᷀͋Ą᷿̦͋͋͋͋M᷂͋͋ ͋͋͘Y͋͋͠O͋͒͋U̫͋͋R͋͛͋ ̡͋͋G͋̇͋O̞͋͋D᷿͋͋>><<endtimedinsert>>"},{"id":"lost and hungry","x":5160,"y":1407,"cat":"vague","out":1,"tags":["vague2"],"content":"\"He said he could [[help me]].\""},{"id":"moved","x":750,"y":1803,"cat":"vague","out":1,"tags":["vague2"],"content":"<<print $friend>> had moved by then.  But how long was that after the first storm, after <<print $pron>> got Mew?\n\n[[You can't remember|why]]."},{"id":"\"Where was your brother?\"","x":5070,"y":1308,"cat":"vague","out":1,"tags":["vague2"],"content":"\"Yeah, you remember him too.  He was there, upstairs.  He said it was the brightest lightning he ever saw.  Then the knocking started.\"\n\n[[(Listen.)]]\n[[\"What happened then?\"|(Listen.)]]"},{"id":"Feed","x":4980,"y":2199,"cat":"den","out":3,"tags":["Den"],"content":"<<print $friend>> looks at you, <<print $posspron>> eyes watering.\n\nFor a long time <<print $pron>> doesn't say anything, and then suddenly, you understand.\n<<set $distress = $distress+3>>\n[[\"I don't believe you.\"]]\n[[(Punch <<print $friend>>.)]]\n[[\"I want to go home.\"|GoingHome2]]"},{"id":"Forbid","x":4080,"y":1605,"cat":"den","out":1,"tags":["Den"],"content":"<<set STOP IT NOW>><<playsound $StopIt>>\n<<set $distress = $distress+1>>\nYou blink.  <<print $friend>> has abruptly fallen silent.\n<<set $forbid = \"yes\">>\\s\n<<set $sad = \"yes\">>\n[[\"Did someone just say something?\"|\"I... I'm not sure.\"]]\n[[\"What was that?\"|\"I... I'm not sure.\"]]"},{"id":"\"You don't remember?\"","x":4530,"y":912,"cat":"den","out":1,"tags":["Den"],"content":"\"Remember what?\"\n\n[[\"The storm.  It happened a few weeks ago, it was huge, it took down trees...\"]]\n[[\"I actually forgot until tonight.  There was this huge storm a few weeks ago, I think...\"|\"The storm.  It happened a few weeks ago, it was huge, it took down trees...\"]]"},{"id":"\"Hm?\"","x":2910,"y":1011,"cat":"den","out":1,"tags":["Den"],"content":"\"Thanks for spending the night,\" <<print $pron>> says.\n\n[[You play together for a good while|TimeIncrement]]."},{"id":"\"Almost time for what?\"","x":1110,"y":3090,"cat":"den","out":1,"tags":["Den"],"content":"\"You can't go,\" says <<print $friend>>, ignoring your question.  \"There's so much stuff I had planned for tonight, I was gonna let you play the next Zelda game, the one that's not even out yet...\"\n<<stopsound $ambient>><<stopsound $tick>>\nBefore you can say anything, <<print $pron>> is already [[running upstairs]]."},{"id":"\"This isn't a very funny joke for you all to play on me.\"","x":2460,"y":1704,"cat":"den","out":2,"tags":["Den"],"content":"\"Don't be stupid,\" says <<print $friend>>, a little meaner than you'd expect.  \"I bet they're just being weird.  Give me a second.\"\n\nAs <<print $pron>> stands and moves out of the room, <<print $pron>> points back at the 64.  \"You can play my game if you want.\"\n\n[[Play a little]].\n[[Wait]]."},{"id":"\"Could you please stop messing with me?\"","x":4800,"y":1110,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> shakes <<print $posspron>> head.  \"No, no, you don't understand.  Please, I'm //not// messing with you, but this is important.  But this... this is different, something's different, he said no one would remember the storm.\"\n\n[[\"Who?\"]]\n[[\"What?\"|\"Who?\"]]"},{"id":"Return","x":2640,"y":1407,"cat":"den","out":1,"tags":["Den"],"content":"\"They look fine to me,\" says <<print $friend>>.  \"Mom said she's gonna bring us popcorn soon.\"\n<<set $Diningclear = \"yes\">>\n[[\"What?\"|ShrugOff]]\n[[\"But I saw them...\"|ShrugOff]]"},{"id":"You decide to investigate","x":5160,"y":3090,"cat":"burned","out":1,"tags":["HouseBurned"],"content":"The second floor has either mostly burned away or fallen through, but standing in what used to be the den you look up to the hole that would have been <<print $friend>>'s room.\n\nThe broken glass and charred drywall [[crunch beneath your feet]]."},{"id":"on this account","x":5340,"y":3288,"cat":"vague","out":1,"tags":["vague3"],"content":"One day after school you ride your bike by [[to check it out]]."},{"id":"Oh","x":4440,"y":516,"cat":"den","out":1,"tags":["Den"],"content":"\"Oh,\" <<print $pron>> says.\n\n<<timedinsert 2s>>And then:<<endtimedinsert>>\n\n<<timedinsert 3s>>[[\"Thank you.\"]]<<endtimedinsert>>"},{"id":"flat on the floor","x":1740,"y":1704,"cat":"den","out":1,"tags":["Den"],"content":"For a moment you don't think you can get up.  Your whole body feels heavy.  Did <<print $pron>> hit you?\n<<set $business = \"yes\">>\n\"I hate you,\" says <<print $friend>>.  \"Leave me alone.\"\n<<set $fight = \"yes\">>\nYou finally manage to sit up as <<print $pron>> turns back to <<print $posspron>> game.\n<<set $distress = $distress+5>>\n[[You take a moment to collect yourself|DenHub]]."},{"id":"(Remember the construction crews.)","x":570,"y":1506,"cat":"vague","out":1,"tags":["vague2"],"content":"There had been a storm not too long ago.  Trees were down all over town.  Buildings had collapsed.\n\nYou were standing at an intersection with <<print $friend>> as a truck rumbled by, loaded up with ragged tree trunks.\n<<set $oldstorm = \"yes\">>\nWhat a [[bad storm|managed to get it]].\n"},{"id":"(Begin packing your stuff.)","x":5700,"y":2892,"cat":"den","out":3,"tags":["Den"],"content":"\"Please,\" says <<print $friend>>, \"please don't go.  I've never not fed him, and if I don't, I'm not sure what will happen.\"\n\n[[\"So you just want me to get eaten, or whatever?\"]]\n[[\"Shut up and leave me alone.\"]]\n[[(Continue packing in silence.)]]"},{"id":"Special thanks","x":3180,"y":3189,"cat":"default","out":1,"tags":[],"content":"Special thanks goes, as always, to my beta-testers: Spam, Matt, Jeremy, Dan, Ivy, Alex, Harrison, and Victor.\n\nCameron Kunzelman, for pointing me toward Kimberly Parker when I was looking to commission art, and to Kim herself, for being amazingly talented and an outstanding person to work with.\n\nAndi McClure, for making an excellent art-creation tool with Icosa.\n\nTo the folks on Twitter who told me their own \"uncle from Nintendo\" stories when this project had a very different format.  And while you're at it, check out [[this great thread on the same subject by Chris Sims|https://twitter.com/theisb/status/500484702827212801]].\n\nTo everyone who's read, liked, shared, and supported my work in the past.\n\nTo -- among many, many others -- Zoe Quinn, Anita Sarkeesian, Leigh Alexander, Brianna Wu, who have glimpsed too closely the monster at which I here only glance awry.\n\nAnd to everyone willing to play a different game.\n\n[[Back|INSPIRATIONS]]."},{"id":"˄ſ̳Ɏ","x":3270,"y":3387,"cat":"default","out":1,"tags":["hint6"],"content":"Repetition, with a difference.  It is not the time for running.\n\nGo where you're not wanted.  Go where you've been told you can't go.\n\n[[Back|credits]]."},{"id":"Play solo","x":2730,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"You do you best to figure out the unfamiliar control scheme while <<print $friend>> sits by, giving you a few commands every so often.\n\nThe game seems very familiar to you, but you've never played it before.  The colors are a lot brighter and clearer than any other game you've ever seen.\n\n[[You play for a while|TimeIncrement]]."},{"id":"\"Did you let me win?\"","x":2910,"y":912,"cat":"den","out":1,"tags":["Den"],"content":"\"What?\" asks <<print $friend>>, laughing.  \"No.\"\n\nThere's a pause.\n\n\"Why would you even think that?\" <<print $pron>> adds, suddenly.\n\nYou're not sure how to answer.\n\nThis has gone on [[for a while|TimeIncrement]]."},{"id":"begins mowing down pedestrians, giggling","x":3090,"y":813,"cat":"den","out":1,"tags":["Den"],"content":"You don't think this is very funny, but to <<print $friend>> it's hilarious.\n\nAfter a while <<print $pron>> stops the car and waits; an ambulance appears and, once the paramedics exit, <<print $pron>> beats them to death with a baseball bat.\n\n\"Isn't this great?\" <<print $pron>> asks.\n<<set $distress = $distress+1>>\n[[This goes on for a while|TimeIncrement]]."},{"id":"Turn on the Gameboy","x":3540,"y":1803,"cat":"gameboy","out":1,"tags":["Gameboy"],"content":"<<stopallsound>>[[START]]"},{"id":"closet1","x":1110,"y":912,"cat":"glitch","out":1,"tags":["BathroomGlitched"],"content":"The closet is completely empty.  The walls are a strange, untextured white.\n\n[[What is going on here?|Bathroom1]]"},{"id":"jealous","x":570,"y":1704,"cat":"vague","out":1,"tags":["vague2"],"content":"<<print $friend>>'s brother...\n\nWhat about him?  Why does remembering that comment make you feel [[uneasy|ThinkingCount]]?"},{"id":"confusedly","x":2820,"y":2793,"cat":"vague","out":1,"tags":["vague3"],"content":"\"Oh,\" he says, eventually.  \"<<print $friend>>.  Well, I'm surprised <<print $pron>> didn't tell you about this, but <<print $pron>> and <<print $posspron>> family [[moved away]].\""},{"id":"\"She's good.  I wish she didn't have to work so late all the time.\"","x":4080,"y":1110,"cat":"den","out":2,"tags":["Den"],"content":"<<if $sad eq \"yes\">>\\s\n\"Yeah,\" agrees <<print $friend>>.  \"It can be hard when parents...\"\n\n[[When they what?]]\n<<else>>\"Yeah,\" <<print $friend>> says, almost laughing.  \"That would suck, huh?\"\n\n[[\"It does.\"]]<<endif>>"},{"id":"Yes","x":2100,"y":2100,"cat":"den","out":2,"tags":["Den"],"content":"Then //why can't you remember his name?//\n<<set $distress = $distress+1>>\n[[Ask <<print $friend>> about <<print $posspron>> brother]].\n[[Forget this, ignore it, do something else|TimePasses]]."},{"id":"DenIntro","x":1110,"y":516,"cat":"den","out":2,"tags":["Den"],"content":"You drop your sleeping and overnight bags in the corner of the den and then pause to take a look around.\n\nBehind the couch a grandfather clock is ticking softly.  Through a set of patio doors on the far side of the room you can see the sky is just as gray as it was when your mom left.\n\nFramed pictures line the walls and over the dark fireplace hangs a monstrous pair of antlers from a buck that <<print $friend>>'s dad shot years ago.\n\nAnd of course, there is the [[big screen TV]].\n\n<<if $tv eq \"yes\">><<print $friend>> entered the room while you weren't paying attention, and <<print $pron>> now stands in the doorway smiling expectantly.\n\n\"Are you ready for dinner?\" <<print $pron>> asks.\n<<loopsound $rain>>\n[[\"Sure.\"|DinnerTime]]\n[[\"Yeah!\"|DinnerTime]]<<endif>>"},{"id":"managed to get it","x":660,"y":1605,"cat":"vague","out":3,"tags":["vague2"],"content":"\"Oh, my uncle got a job at Nintendo,\" said <<print $friend>>.\n\nYou were walking home together, past one of the [[construction crews|(Remember the construction crews.)]].  <<print $friend>> still lived next door to you [[at the time]].\n\n[[\"Oh.\"]]"},{"id":"(Quietly begin gathering up your things.)","x":1200,"y":2991,"cat":"den","out":1,"tags":["Den"],"content":"This draws <<print $friend>>'s attention.\n\n\"What are you doing?\" <<print $pron>> asks.\n\n[[Explain that you're leaving|Announce that you're leaving.]]."},{"id":"\"Good game.\"","x":3180,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"\"Ready to try again?\" <<print $friend>> asks.\n\n\"Let's switch it up,\" you say.\n\n[[You've been playing for a while|TimeIncrement]]."},{"id":"Announce that you're leaving.","x":1020,"y":2991,"cat":"den","out":3,"tags":["Den"],"content":"\"What?\"  <<print $friend>> stands up, not even bothering to pause the game.  \"No, you can't leave, it's almost time...\"\n\n[[\"I'm not having fun.\"]]\n[[\"Almost time for what?\"]]\n<<if $fight eq \"yes\">>\\s\n[[\"I don't think we're friends anymore.\"]]\n<<endif>>"},{"id":"EndGameHub","x":3900,"y":1704,"cat":"glitch","out":2,"tags":["DenGlitch"],"content":"<<playsound $rain>><<loopsound $tick>>In the corner the grandfather clock is ticking softly.  Through a nearby set of patio doors you can see it's dark and rainy.\n\n<<print $friend>> is parked in front of the large TV, playing something on the Nintendo 64.  Suddenly, <<print $pron>> jumps, as if you scared <<print $dopron>> by entering when you did, and turns to look at you.\n\n\"What was that?\" <<print $pron>> asks.\n\n[[\"It was me.\"]]\n[[\"I know about the uncle.\"]]"},{"id":"looked different","x":840,"y":1803,"cat":"vague","out":1,"tags":["vague2"],"content":"Your Mew was small, even cute, standing there with its round, cheerful eyes.\n\nBut when <<print $friend>>'s had wiped out everyone at school, it had looked completely different: compact, snarling, [[fierce|Including Mew]]."},{"id":"at the time","x":660,"y":1506,"cat":"vague","out":1,"tags":["vague2"],"content":"Wait, this couldn't have been too long ago... when did <<print $friend>> move?\n<<set $house = \"yes\">>\n[[There was something nice about being neighbors|managed to get it]]."},{"id":"Nope","x":3540,"y":1605,"cat":"gameboy","out":1,"tags":["Gameboy"],"content":"No, you won't run.  Not this time.\n\n[[Back|START]]."},{"id":"car honks outside","x":5880,"y":3189,"cat":"den","out":1,"tags":["Den"],"content":"<<playsound $honk>>You get up to leave.  <<print $friend>> has wandered over to the fireplace, and is looking into its unlit depths as you walk out the door and [[into the night|into the rain]]."},{"id":"into the kitchen","x":2910,"y":1704,"cat":"kitchen","out":3,"tags":["Kitchen"],"content":"You are in the empty kitchen.  The dining room is [[behind you]].\n<<fadeoutsound $thunder>>\nYou could grab something out of the [[fridge|Fridge]] or exit through the back to [[return to the den|ToTheDen]]."},{"id":"Play a little","x":2550,"y":1506,"cat":"den","out":1,"tags":["Den"],"content":"After a moment of hesitation you sit down and play the game <<print $friend>> has running.\n<<set $distress = $distress-1>><<set $Diningclear = \"yes\">>\nIt's a little like <<print either (\"Banjo-Kazooie\", \"Goldeneye\", \"Star Fox\", \"Mario\", \"Diddy Kong Racing\", \"Zelda\")>>, but it's not a game you're familiar with.  The colors are a little weird.\n\nStill, it's relaxing.\n\nAfter a while, <<print $friend>> [[comes back|Return]]."},{"id":"Take out the Gameboy","x":3450,"y":1803,"cat":"glitch","out":1,"tags":["KitchenGlitch"],"content":"From your pocket you pull <<print $friend>>'s Gameboy Color.\n\nThe uncle is somewhere behind the half-textured walls, grumbling to itself.\n\n[[Turn on the Gameboy]]."},{"id":"Oh2","x":2100,"y":2397,"cat":"den","out":1,"tags":["Den"],"content":"\"I guess...\" you begin.\n\n<<print $friend>> is still looking at you.\n\n[[\"I got confused.\"|\"But I remember him.\"]]\n[[\"I was thinking of someone else.\"|\"But I remember him.\"]]\n[[\"I was just jealous of you being an only child for a second.\"|\"But I remember him.\"]]"},{"id":"Room3","x":1650,"y":516,"cat":"vague","out":1,"tags":["vague1"],"content":"<<print $friend>> looks to the clutter in the cabinet.\n\n\"Oh yeah,\" <<print $pron>> says.  \"They're pretty cool.  I can't show them to you though, they're still secret.  I promised my uncle.\"\n\nOf course, you suddenly remember, <<print $posspron>> [[uncle]]."},{"id":"\"Does Nintendo have a lot of business here?\"","x":1470,"y":1308,"cat":"den","out":2,"tags":["Den"],"content":"\"Why else would my uncle be coming?\" <<print $friend>> says, as if you've asked the dumbest question in the world.\n\n[[\"Well, it's cool I'll finally get to meet him.\"]]\n[[\"Oh, what sort of business?\"|\"Then what does he have to do here?\"]]"},{"id":"the author's notes","x":3720,"y":3486,"cat":"default","out":8,"tags":[],"content":"[[On Author's Notes]]\n\n[[On Making Games]]\n\n[[On Creepypasta]]\n\n[[On Lying to Your Friends]]\n\n[[On Sleepovers]]\n\n[[On Topicality]]\n\n[[On Gamers Being Over]]\n\n[[Back|credits]]."},{"id":"still there","x":2730,"y":1803,"cat":"dining","out":1,"tags":["DiningRoom"],"content":"The table hasn't yet been cleared, and they're still sitting in the exact same places you left them.\n\nIn fact, you realize, they [[aren't moving at all]]."},{"id":"Dinner","x":1020,"y":516,"cat":"dining","out":1,"tags":["DiningRoom"],"content":"<<fadeoutsound $thunder>><<print $friend>>'s mom meets you just inside.  \"Hello!\" she says. \"Dinner will be ready in just a few minutes, but you can drop stuff off in the den. You and <<print $friend>> are camping out there tonight.\"\n\n[[\"Cool!\"|DenIntro]]\n[[\"Okay!\"|DenIntro]]\n[[(Nod and go to the den.)|DenIntro]]"},{"id":"ToTheDen","x":480,"y":912,"cat":"vague","out":1,"tags":["vague1"],"content":"<<loopsound $tick>>\\s\n<<loopsound $ambient>>\\s\n<<set $counter = $counter+1>>You head [[back to the den|DenHub]]."},{"id":"ShrugOff","x":2640,"y":1308,"cat":"den","out":1,"tags":["Den"],"content":"\"Nice try for a prank, though,\" says <<print $friend>>, seemingly ignoring you.\n\n\"Oh, and one more thing,\" <<print $pron>> says while <<print $pron>> resumes <<print $posspron>> spot in front of the Nintendo, \"thanks for sending me out then.  Mom made me help her clean up after all.  Special company.\"\n\n[[\"What?\"]]"},{"id":"toilet1","x":1200,"y":813,"cat":"glitch","out":1,"tags":["BathroomGlitched"],"content":"You realize there's something wrong with the toilet.  The water in the bowl looks solid, like glass.\n\nWhen you attempt to turn the handle, nothing happens, but the toilet emits the sound of flushing anyway.\n<<set $bathroomvisit = \"yes\">>\nYou suddenly don't feel like having to go anymore.\n\n[[What is going on here?|Bathroom1]]"},{"id":"\"But they're jerks.  Who cares what they have to say?\"","x":4260,"y":219,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> shrugs, tiredly.  \"Yeah,\" <<print $pron>> says, \"who does care?\"\n\nWithout another word, <<print $pron>> returns to the Nintendo, leaving you [[alone with your thoughts|TimeIncrement]]."},{"id":"\"Your uncle stays with you when he visits?\"","x":1740,"y":1110,"cat":"den","out":1,"tags":["Den"],"content":"\"Yeah,\" says <<print $friend>> nonchalantly.  \"He lives pretty far away and so he just drops by.\"\n\n[[\"Isn't that a little weird?\"]]"},{"id":"fed it","x":3360,"y":1902,"cat":"vague","out":1,"tags":["vague3"],"content":"And you had an idea.\n\nIt did not like your first request, but it was hungry, and it had no other choice.\n<<fadeoutsound $StormGlitch>>\n[[So here you are|START]]."},{"id":"someone else","x":2910,"y":714,"cat":"den","out":2,"tags":["Den"],"content":"\"Did you figure it out?\" asks <<print $friend>>, once the man in the game has apparently stood up and left the conversation.\n\n[[\"Figure //what// out?\"|\"There was something to figure out?\"]]\n[[\"There was something to figure out?\"]]\n[[\"Of course.\"]]"},{"id":"On Creepypasta","x":3900,"y":3585,"cat":"default","out":1,"tags":[],"content":"When I was younger the phrase \"creepypasta\" had a particular meaning.  It was the name for a sort of post that appeared on 4chan, most usually, that began as the narration of some event from the poster's life and which soon veered into supernatural or at least generally surreal horror.  Beyond this there wasn't much to define the content, other than the implicit idea in the nickname that the story would be saved and posted again by various other people, always hoping to introduce the story to someone who hadn't seen it yet and, perhaps, dupe the unsuspecting into taking it for \"real\" due to the genre's maintenance of what MR James once called, regarding the proper construction of a ghost story, \"the pretense of truth.\"\n\nSome years later, after not keeping tabs on the community, I was surprised to find that creepypasta now meant just about anything inflected with horror that a person of a certain age encountered on the internet.  My game \"My Father's Long, Long Legs,\" released in the autumn of 2013, had no pretense of truth about it and nevertheless was often circulated as \"creepypasta\" or among people who considered themselves enthusiasts of the genre.\n\nAt this point I also discovered two things. First, a rather unusual fandom had grown up around creepypasta, whose consistent object of adoration was a shared pseudo-continuity in which the various monsters and villains from the stories coexisted, were friends or enemies, and had adventures (surprisingly, this included one creature I made myself, back in the dark and backward abysm of my own 4chan days).  Second, by and large these were in some sense \"classic\" or \"vintage\" creepypasta, as the stories being currently produced had developed an oddly specific preoccupation with videogames and gaming culture that had not been the case my epoch of 2008.\n\nOften these stories involved cursed or somehow \"evil\" versions of popular games, the most famous examples here probably being Pokémon Black, the Blood Whistle, or Ben Drowned.  Given the range of material earlier instances of the genre had covered, it struck me as peculiar that games would have been singled out in this way.\n\nTo paraphrase Zizek, the key to understanding a horror story is to imagine the same story but without the horror element.  When we do this we can locate, on some level, the true horror: the thing that must be fantasized and fictionalized in order that it becomes a digestible, \"entertaining\" horror story, rather than something truly unpleasant.\n\nIf we perform this deconstruction on the many permutations of the videogame creepypasta subgenre, what happens?  The story we end up with, time and again:\n\n//I bought a game, and I played it.  I received a game as a gift, and I played it.  I found a used game for sale, and I played it. I picked up an old game from our childhood, and I played it...//\n\nWhat these stories reveal, I think, is an underlying anxiety we have about games in general: that beneath their smiling faces and heroic poses Mario and Link are somehow //hostile// to us.  That if these emblems of childhood and adolescent pleasure had their way, we would keep playing with them until it killed us.\n\nPerhaps here we can find the \"pretense of truth\" that seemed to otherwise go missing: there is something about games culture, its particular awareness of itself in its own moment of history, that facilitates the experience of horror at the industry's own promises of endless and repetitive play.\n\nGames, in this perspective, both loathe us, and need us.\n\n[[Back|the author's notes]]."},{"id":"night","x":1380,"y":3189,"cat":"default","out":1,"tags":["HouseOutsideNight"],"content":"As y through the rubble of <<print $friend>>'s burned down house, you found <<print $posspron>> old Gameboy and took it home.\n\nCoincidentally, your uncle has a new job.  Lucky you.\n\n[[Back|credits]]."},{"id":"\"You had a brother, didn't you?\"","x":4980,"y":1209,"cat":"vague","out":1,"tags":["vague2"],"content":"\"You remember him, too?\" <<print $friend>> asks.  \"He saw it first.  The flash.  From his bedroom window.\"\n\n<<print $pron>> pauses.\n\n\"But I was the one who [[answered the door]].\""},{"id":"School","x":3810,"y":813,"cat":"den","out":1,"tags":["Den"],"content":"<<if ($distress lte 3) and ($sad eq \"no\")>>\\s\n<<print either(\"You and <<print $friend>> discuss class a few days ago, when the teacher publicly chastised a classmate you mutually dislike\", \"You ask <<print $friend>> how <<print $pron>> did on a math quiz you had trouble with -- <<print $pron>> got an A, of course\", \"You begin by talking about a mutual acquaintance who moved away, but <<print $friend>> quickly changes the topic\", \"<<print $friend>> tells you that <<print $pron>> heard a teacher you both had the grade before is in the hospital.  You ask why, but <<print $pron>> doesn't know; you spend time reminisicing about the prior year\", \"It occurs to you that even though <<print $friend>> does really well in school, you seem to remember <<print $dopron>> having some trouble earlier in the year.  You ask what's up, but receive no answer\")>>.<<endif>>\\s\n<<if ($distress gte 4) and ($sad eq \"no\")>>\\s\nYou try to strike up a conversation, but <<print $friend>> is too involved in the game and seems to be ignoring you.  You simply watch <<print $dopron>> play in silence.<<endif>><<if $sad eq \"yes\">>You try to strike up a conversation, but <<print $friend>> doesn't seem to want to talk about school and ignores you.<<endif>>\n\n[[An hour passes|TimeIncrement]]."},{"id":"\"Sorry.\"","x":1110,"y":2397,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"\"Just don't call again unless it's an emergency, okay?\"\n\nAnd with that, she hangs up.\n\n[[You head back|ToTheDen]]."},{"id":"Remember your own Mew","x":1020,"y":1704,"cat":"vague","out":1,"tags":["vague2"],"content":"You got your own Mew, [[eventually]].<<stopsound $tick>><<stopsound $ambient>>"},{"id":"On Lying to Your Friends","x":3900,"y":3684,"cat":"default","out":1,"tags":[],"content":"I don't believe I ever had a friend who claimed they had an \"uncle who worked for Nintendo\" and yet, nevertheless, the trope has always made sense to me in its deployment as a punchline for unsubstantiated gaming gossip.  Certainly I had conversations with friends that turned on similar structural logics: one of us claiming dubious knowledge about the secret workings of a game, or the future moves of a particular developer, or the games industry in general.\n\n\"The uncle who works for Nintendo\" on a very basic level is interesting because of how well it encapsulates the frank bullshittery of such conversations.  \"I have an uncle who works for Nintendo, and he says...\"  Let's break this down.\n\nThis is obviously something a child says.  It is marked as such by its appeal to a specifically adult authority.  Yet, interestingly, it is not a parental authority, but rather a sort of subjunctive adult presense -- the uncle, rather than a parent.  Uncles have more interesting lives than our parents.  They're proverbially eccentric, and they can work for Nintendo.  There is something ghostly or fantasmatic at work here, the avuncular remainder of patriarchal authority.\n\nIn this way the knowledge becomes both authoritative and somehow illicit: it is a //secret//, something told //in confidence//, away from the purview of the central authority figure, and it is only in greatest trust that your friend now passes the word along to you.\n\nThis establishes, for the friend, a special relationship not only with the adult world but with the \"gaming industry\" as such.  Why would children lie like this, in ways that are transparently obvious to the point that they can become self-sufficient punchlines?\n\nOn one level, it works (or worked) because it reproduces to some extent the language of gaming's enthusiast press and the fantasy of \"exclusive access.\"  Our Nintendo Powers and GameInformers wanted us to think this way about game development: it was Willy Wonka's chocolate factory, filled with incredible secrets, only to be glimpsed by a lucky few.  The enthusiast magazines were our many uncles at developer X, covertly sneaking out screenshots and tid-bits and rumors for our breathless delectation.\n\nFor the friend who told blatant lies -- likely flippantly, perhaps not even fully sure why they did it -- the potential payoff was to be like one of these magazines, to become the representative of the uncle at Nintendo: an insider, authoritative, knowledgeable.  It was, in short, a power play.\n\nCuriously, in reading people's reflections on weird gaming rumors they circulated when they were younger, I find a common theme: people very often repeated things they knew or at least strongly suspected to be untrue not because they fabricated the lies themselves, but because //they had been lied to about them before//.\n\nThis makes sense: it's how certain rumors managed to become so widespread despite being obviously false.  And on the other hand, it suggests a symmetry between the mechanism of the \"secret knowledge\" of games and the mechanism by which creepypasta spread: the urban legend, the modern myth.\n\nTo lie and be believed, even regarding something small and harmless, is to hold a type of power over someone else.  Thus, in a nebulous third arena, we might locate here a certain mild maliciousness: a desire to deceive others as we have been deceived, to steal for ourselves the aura of exclusive access that the friend who claimed their uncle worked at Nintendo seemed, at least for a time, to possess.\n\n[[Back|the author's notes]]."},{"id":"credits","x":3450,"y":3189,"cat":"hub","out":17,"tags":["vague4"],"content":"a twine game by [[michael lutz|http://twitter.com/WarrenIsDead]]\noriginal art by [[kimberly parker|http://www.kimberlyparker.ca/]]\nabstract backgrounds made with Icosa by [[mcc|http://runhello.com/]]\nscripts and CSS resources by [[leon arnott|http://l.j-factor.com/]] and [[tory hoke|http://www.toryhoke.com/]]\n[[sound credits]]\n\n[[INSPIRATIONS]]\n\nENDINGS\n1. <<if $meeting eq \"no\">>[[LOCKED|HINT1]]<<else>>[[Undefined Error]]<<endif>>\n2. <<if $hide eq \"no\">>[[LOCKED|HINT2]]<<else>>[[Run]]<<endif>>\n3. <<if $escape eq \"no\">>[[LOCKED|HINT3]]<<else>>[[Exit]]<<endif>>\n4. <<if $safe eq \"no\">>[[LOCKED|HINT4]]<<else>>[[All Unsaved Data Will Be Lost]]<<endif>>\n5. <<if $end eq \"no\">>[[LOCKED|HINT5]]<<else>>[[Do You Want to Continue?]]<<endif>>\n<<if ($end eq \"yes\") and ($survive eq \"no\")>>\\s\n<p style=\"color: #000000\"><span style=\"background-color:salmon\">[[˄ſ̳Ɏ]]</span></p><<else>><<if ($survive eq \"yes\")>>[[New Game]]<<else>>˄ſ̳ɎÅʅČɴ˓\n<<endif>>\\s\n<<endif>>\n<<if $survive eq \"no\">>CONTINUE?\n[[Restart from the beginning|Best Friend]].\n[[Restart at 7:00 in the den]].<<else>>\n\nYou have unlocked [[the author's notes]].<<endif>>"},{"id":"a Gameboy","x":4890,"y":2991,"cat":"burned","out":2,"tags":["HouseBurned"],"content":"It's a Gameboy Color, not at all scuffed or damaged.  In the back is a single cartridge, a copy of Pokémon Blue.\n\n[[You take <<print $friend>>'s Gameboy]].\n[[You leave the Gameboy]]."},{"id":"GoingHome3","x":5340,"y":1902,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"Passing <<if $frozenNPCs eq \"yes\">>hesitantly <<endif>>through the <<if $frozenNPCs eq \"yes\">>now <<endif>>empty dining room, you enter the kitchen, where the phone sits on the counter.\n<<fadeoutsound $Snarling>>\n[[Call Mom|CallMom2]]."},{"id":"hiding","x":4350,"y":2397,"cat":"glitch","out":1,"tags":["BathroomGlitch"],"content":"You're not sure how you know something is out there, because you don't exactly\n<<playsound $creaking>>\n<<set OH CHILD>>\n\nhear it moving, but you know it's there, and you know it's stopped\n\n<<set POOR POOR CHILD>>\n\n[[right outside your hiding spot]]."},{"id":"\"I remember... you used to live next door to me.\"","x":4170,"y":1308,"cat":"default","out":2,"tags":["vagu2"],"content":"\"Right,\" <<print $pron>> says.  \"Right, exactly.\"\n\n[[\"That's how we know each other.\"]]\n[[\"But then you moved.\"]]"},{"id":"in one hit","x":750,"y":1605,"cat":"vague","out":2,"tags":["vague2"],"content":"<<print $friend>> demonstrated this claim at recess, when you and some other friends linked Gameboys to do battle.\n\nYou were the first one down.  [[No one else]] got in a single hit on <<print $friend>>'s Mew.\n\nYou asked how <<print $friend>> [[managed to get it]]."},{"id":"with Mew","x":930,"y":1605,"cat":"vague","out":1,"tags":["vague2"],"content":"You didn't believe <<print $dopron>> at first, when <<print $friend>> came to school one day and told you  <<print $pron>> had finally caught Mew.\n\n\"Prove it,\" you said.\n\nSo <<print $pron>> pulled out <<print $posspron>> Gameboy and [[showed you]]."},{"id":"Answer1","x":2730,"y":1110,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> laughs.  \"Maybe,\" <<print $pron>> says, pushing past you to choose the next game.\n\n[[You realize you've played for quite some time|TimeIncrement]]."},{"id":"Answer2","x":2820,"y":1209,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> gives you an odd look, as if <<print $pron>> genuinely wasn't expecting you to say this.\n\n\"Maybe,\" <<print $pron>> says, almost thoughtfully.  \"Maybe, yeah.\"  But then, <<print $pron>> has moved back to the Nintendo and is choosing another game.\n\n[[You realize you've played for quite some time|TimeIncrement]]."},{"id":"Ask <<print $friend>> about <<print $posspron>> brother","x":2010,"y":2199,"cat":"den","out":1,"tags":["Den"],"content":"[[\"Where's your brother tonight?\"|BrotherInq]]\n[[\"Is your brother spending the night with one of his friends?\"|BrotherInq]]\n[[\"Hey, why aren't there any pictures of your brother up?\"|BrotherInq]]"},{"id":"\"Why do I need to do all that?\"","x":4530,"y":2991,"cat":"vague","out":1,"tags":["vague3"],"content":"\"Silly,\" she says.\n\nYour mom turns from the sink to smile at you, and your throat tightens when you see how [[glassy and empty her eyes are]]."},{"id":"Games","x":3810,"y":714,"cat":"den","out":2,"tags":["Den"],"content":"<<if ($distress lte 5) and ($sad eq \"no\") and ($pron eq \"she\") and ($fem eq \"no\")>>[[Talk about how much you like games]].<<else>><<if ($distress lte 3) and ($sad eq \"no\")>><<print either(\"For a while, you and <<print $friend>> talk about the game on the TV.  It's not one you're familiar with, and <<print $friend>> explains the elaborate systems in some detail\", \"You bring up the subject of the new Pokémon games through some rumors you read on the internet, when you were supposed to be working in the computer lab at school.  <<print $friend>> meticulously debunks or confirms everything you have to say, all based on, of course, what <<print $posspron>> uncle has told <<print $dopron>>\", \"You bring up the subject of fighting games and very quickly you and <<print $friend>> are involved in a slow-moving, not very serious argument about whether or not they are fun\", \"You recount some rumors you read about the new Nintendo console; <<print $friend>> informs you <<print $pron>> has a prototype upstairs you can play later.  When you ask why not now, <<print $pron>> says <<print $pron>> is too busy playing the 64\", \"You have a rather one-sided conversation about whether RPGs on the PlayStation are better than old SNES ones\")>>.<<endif>><<if ($distress gte 4) and ($sad eq \"no\")>>You try to strike up a conversation, but <<print $friend>> is too involved in the game and seems to be ignoring you.  You simply watch <<print $dopron>> play in silence.<<endif>><<if $sad eq \"yes\">>You try to strike up a conversation, but <<print $friend>> doesn't seem to want to talk about games and ignores you.<<endif>><<endif>>\n\n[[An hour passes|TimeIncrement]]."},{"id":"\"But I should.\"","x":4440,"y":318,"cat":"den","out":1,"tags":["Den"],"content":"\"Why?\"\n\n[[\"Because I'm your friend.\"|Oh]]\n[[\"Because they're jerks.\"|Oh]]\n[[\"Because no one should be treated like that.\"|Oh]]\n[[\"Because they shouldn't treat people like that.\"|Oh]]\n[[\"Because they won't stop unless they feel like people will fight them.\"|Oh]]\n[[\"Because I'm sick of it, and I just want to be able to be your friend and play videogames and not have people be terrible about it.\"|Oh]]"},{"id":"Tell her everything.","x":1380,"y":2595,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"Your mother is silent for a long time.\n\n[[\"Mom?\"|\"I want to go home.\"]]\n[[\"Please answer, Mom!\"|\"I want to go home.\"]]"},{"id":"OPTION","x":3630,"y":1704,"cat":"gameboy","out":2,"tags":["Gameboy"],"content":"TEXT SPEED: SLOW MID [[FAST]]\n\n[[Back|START]]."},{"id":"No","x":2100,"y":2199,"cat":"den","out":1,"tags":["Den"],"content":"Your mind is playing tricks on you.  If <<print $friend>> had a brother, surely you'd be able to remember his name.\n<<set $distress = $distress-1>><<set $disavow = \"yes\">>\n[[Do something else|TimePasses]]."},{"id":"On Making Games","x":3900,"y":3783,"cat":"default","out":1,"tags":[],"content":"Every game I make has the same starting point, which is a question I ask myself: how is this project different from the last one?\n\nThe game you just played was the one where I decided to finally attempt something approaching a traditional gamelike structure -- hence the many variables, paths, and multiple endings.  It has not necessarily been calibrated for each path to be accessible in turn for each player; the idea was that two people could play the game and have very similar experiences that, when compared, had certain fundamental differences.\n\nI feel the demand for variety is made more often of interactive fiction, despite most graphical games having very little in the way of non-linear plots or, at least, plot changes beyond the cosmetic.  The sense seems to be that if I am playing a graphical game, I should be happy to simply ride from set-piece to set-piece, shooting enemies or collecting geegaws; relying on text necessitates branching paths, and the more of them, the better.\n\nThe fact that most Twine games eschew these conventions was a real eye-opener for me, and part of what made me feel comfortable enough to begin writing interactive fiction.\n\nNevertheless, my general uneasiness with this sort of writing has confused a lot of players regarding my work, since they expect paths where there are none, or criticize me for not including them.  And because, due to arbitrary conventions of the medium, I know their expectations are not entirely unfounded, and in order to challenge myself and grow as an artist, here I wanted to produce something a little less oppressively gloomy and single-minded than my other pieces.\n\nAssuming I've done my job correctly, what I've made is a horror game that, if it is in the least bit scary when you first play it, manages to get less frightening each subsequent time.\n\n[[Back|the author's notes]]."},{"id":"Including Mew","x":840,"y":1704,"cat":"vague","out":2,"tags":["vague2"],"content":"It didn't one-hit KO most enemies.  It was incredibly weak, and you shamefully cheated the game further to make it strong enough.\n\nIt even [[looked different]] from <<print $friend>>'s.\n\nYou asked <<print $dopron>> [[why]]."},{"id":"Sleepover","x":1020,"y":219,"cat":"default","out":2,"tags":[],"content":"Your best friend <<print $friend>> has invited you to a sleepover at <<print $posspron>> house this weekend!\n\nYou've been friends since first grade, so [[asking your mom]] is basically [[only a formality|FridayNight]]."},{"id":"No more games","x":3900,"y":2892,"cat":"ending","out":1,"tags":["GoodEnd"],"content":"You are my friend, and I am here for you.\n\n<center>[[END]]</center>"},{"id":"Storm","x":1290,"y":219,"cat":"default","out":1,"tags":["OutsideHouseStormy"],"content":"\"I'll pick you up tomorrow at three,\" she says, again as usual.\n\nBut then she pauses, looking up at the sky, which has been overcast throughout the day.\n\n\"If you play outside,\" she adds, \"be careful.  It's probably gonna rain.\"\n\n[[Kiss mom goodbye|Bye]].\n[[Wave goodbye|Bye]]."},{"id":"RunAndHide","x":3540,"y":2298,"cat":"den","out":2,"tags":["Den"],"content":"<<loopsound $knock>>\"That's him,\" says <<print $friend>>, standing up.  \"I should go let him in.\"\n\nAs <<print $pron>> leaves the den, you realize you could [[follow|to follow]], but a part of you really feels like [[being scarce for a bit|running and hiding]]."},{"id":"FAST","x":3810,"y":1605,"cat":"vague","out":1,"tags":["vague4"],"content":"<<playsound $vgloopGLITCH>><<timedinsert 1s>>You are eleven years old.\n\nWhat is your best friend's name?\n<<endtimedinsert>><<timedinsert 2s>>Your best friend <<print $friend>> has invited you to a sleepover at <<print $posspron>> house this weekend!\n\nYou've been friends since first grade, so asking your mom is basically only a formality.<<endtimedinsert>><<timedinsert 3s>>\"You behave yourself, okay?\" she says, as always.  \"I'll be at work, but if anything happens, you call me.\"<<endtimedinsert>><<timedinsert 4s>>  \"I'll pick you up tomorrow at three,\" she says, again as usual.\n\nBut then she pauses, looking up at the sky, which has been overcast throughout he day.\n\n\"If you play outside,\" she adds, \"be careful.  It's probably gonna rain.\"<<endtimedinsert>><<timedinsert 5s>>  You drop your sleeping and overnight bags in the corner of the den and then pause to take a look around.\n\nIn the corner a grandfather clock is ticking softly.  Through a nearby set of patio doors you can see the sky is just as gray as it was when your mom left.\n\nFramed pictures line the walls and over the dark fireplace is a monstrous pair of antlers from a buck that <<print $friend>>'s dad shot years ago.\n\nOn the opposite side of the room stands the big screen TV.<<endtimedinsert>><<timedinsert 6s>>  Dinner passes quickly.  Tonight's meal is spaghetti and meatballs, one of <<print $friend>>'s favorite meals, as <<print $posspron>> mother points out while piling a helping on your plate.\n\n<<print $friend>>'s father <<if $beer eq \"no\">>cracks a beer<<else>>sips a lemonade<<endif>> and jovially interrogates you about how much trouble you and <<print $friend>> getting into at school.\n\nDessert is heaping bowls of ice cream drizzled in chocolate sauce.  You can't even finish yours.<<endtimedinsert>><<timedinsert 7s>>  \"You go along now,\" says <<print $friend>>'s mom, smiling from her side of the table.  \"We'll clean up in here.\"\n\n\"Let's go get the TV ready,\" says <<print $friend>>.<<endtimedinsert>><<timedinsert 8s>>  <<print $friend>> looks to the clutter in the cabinet.\n\n\"Oh yeah,\" <<print $pron>> says.  \"They're pretty cool.  I can't show them to you though, they're still secret.  I promised my uncle.\"\n\nOf course, you suddenly remember, <<print $posspron>> uncle.<<endtimedinsert>><<timedgoto \"EndGameHub\" 10s>>"},{"id":"crunch beneath your feet","x":5070,"y":2991,"cat":"burned","out":1,"tags":["HouseBurned"],"content":"Until you step on something that [[isn't glass]]."},{"id":"You take <<print $friend>>'s Gameboy","x":4800,"y":3090,"cat":"burned","out":1,"tags":["HouseBurned"],"content":"Looking from side to side, as if anyone might actually be watching, you pick up the Gameboy and flick on the power switch.\n\nAfter clicking through the Pokémon intro screens, you find there is no saved game on the cart.  It's like a brand new copy.\n\nYou turn off the Gameboy and, stuffing it in your pocket, [[return home]]."},{"id":"TimeIncrement","x":480,"y":813,"cat":"vague","out":1,"tags":["vague1"],"content":"The clock chimes.\n<<set $time = $time+1>>\\s\n<<set $min = \"00\">>\\s\n<<set $counter = 0>>\\s\n<<playsound $chime>>\\s\n<<loopsound $tick>>\\s\n<<loopsound $ambient>>\n[[You are in the den|DenHub]]."},{"id":"\"I'm not having fun.\"","x":1020,"y":3090,"cat":"den","out":1,"tags":["Den"],"content":"\"But you will! I promise.  There's so much stuff I had planned for tonight, I was gonna let you play the next Zelda game, the one that's not even out yet...\"\n\nBefore you can say anything, <<print $pron>> is already [[running upstairs]]."},{"id":"\"I want to go home.\"","x":1200,"y":2496,"cat":"kitchen","out":4,"tags":["Kitchen"],"content":"<<if $distress gt 4>>\\s\nSomething in your voice seems to give her pause.\n\n\"Okay,\" she says, after a moment.  \"I'll call the sitter and tell her to come pick you up. It'll probably be an hour.  Is that okay?\"\n\n[[\"Yes, yes, thank you!\"]]\n[[\"Can't you make her get here faster?\"]]<<else>>\"Really, honey?\" she asks.\n\n[[\"Yes!\"|PickUp]]\n[[\"Please, Mom, please.\"|PickUp]]\n[[\"Never mind.\"|EndCall]]\n<<endif>>"},{"id":"...you clench your teeth and wait.","x":1650,"y":1605,"cat":"den","out":2,"tags":["Den"],"content":"<<print $friend>> darts forward and pushes you back onto the hardwood floor, cracking your skull against the carpet.\n\n[[You take the initiative and throw a punch before <<print $pron>> can go for you again.]]\n[[You take a moment to be dazed.]]"},{"id":"uncle","x":1740,"y":516,"cat":"vague","out":1,"tags":["vague1"],"content":"The uncle who works for Nintendo.\n<<timedgoto \"DenHub\" 4s>>\\s\n<<loopsound $tick>>\\s\n<<loopsound $ambient>>"},{"id":"CallMom2","x":5520,"y":2001,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"You dial your mom's work number and wait.\n\nShe picks up after [[three rings|threerings2]]."},{"id":"(Listen.)","x":5160,"y":1209,"cat":"vague","out":1,"tags":["vague2"],"content":"\"I answered the door when the knocking started.  He said he was [[lost and hungry]].\""},{"id":"(Continue packing in silence.)","x":5700,"y":2991,"cat":"den","out":1,"tags":["Den"],"content":"\"Why could you hear him?\" <<print $pron>> asks, but it doesn't seem like <<print $pron>> expects you to answer.\n\nYou both lapse into an awkward silence.  Eventually, a [[car honks outside]]."},{"id":"SchoolDudes","x":3990,"y":120,"cat":"vague","out":1,"tags":["vague1"],"content":"<<cyclinglink  \"Girls don't play videogames.\" \"Why don't you play girl games?\" \"You're not as good at this as a boy would be.\" \"I don't want to trade Pokémon with you.\" \"Girls don't play videogames.\" \"I could beat you at any game.\" \"No, you don't understand, here, what you really need to do is...\" \"You're just taking your brother's games.\" \"Sheik isn't Zelda! You're lying!\"  \"Girls don't play videogames.\" \"Let me tell you how to beat that level.\"  \"Girls don't play videogames.\" \"Do you only play games because you want us to like you?\"  \"Girls don't play videogames.\" \"You cheated.\"  \"Girls don't play videogames.\" \"Do you just want a boyfriend?\"  \"Girls don't play videogames.\" \"How many Barbie games do you have?\" \"You play games because you'll never get a boyfriend.\"  \"Girls don't play videogames.\" \"Are you a lesbian? Do you know what a lesbian is?\" \"Go away.\" \"Girls don't play videogames.\" \"You're ugly.\" \"Girls don't play videogames.\" \"We don't like you.\" \"Girls don't play videogames.\" \"No one likes you.\" \"Girls don't play videogames.\" \"That's why you play videogames.\" \"No one wants to be your friend.\"  \"Girls don't play videogames.\">><<timedgoto \"EndSchoolDudes\" 10s>>"},{"id":"\"What are you talking about?\"","x":4980,"y":1407,"cat":"vague","out":1,"tags":["vague2"],"content":"\"We got in a fight,\" <<print $friend>> explains.  \"It was a fight over how I was getting all the cool stuff from my uncle.  I think he was... starting to remember.  Like you.\"\n<<if ($pron eq \"she\")>>\\s\n\n<<print $friend>> chews <<print $posspron>> lip.  \"He said that I couldn't appreciate all this since I was a girl.\"<<endif>>\n\n[[\"So what happened?\"]]\n[[\"What did you do?\"|\"So what happened?\"]]"},{"id":"cracks it open","x":3720,"y":2595,"cat":"den","out":1,"tags":["Den"],"content":"<<stopsound $knock>>\"You can come in,\" <<print $pron>> says to whoever stands out there on the porch, then looks over <<print $posspron>> shoulder at you.\n<<playsound $Snarling>>\n\"Sorry,\" <<print $pron>> says.\n\nBefore you can ask what there is to be sorry about, the [[door slams open]]."},{"id":"\"That's how we know each other.\"","x":4080,"y":1407,"cat":"vague","out":1,"tags":["vague2"],"content":"\"It's why we're friends!\" says <<print $friend.>>  \"I would come over to your house when mom was out or when dad was...\"\n\n[[\"When your dad was drunk.\"]]"},{"id":"the real Mew","x":660,"y":1704,"cat":"vague","out":1,"tags":["vague2"],"content":"You asked what <<print $pron>> meant by that.\n\n\"Just what I said,\" <<print $friend>> replied.  \"You cheated, and got a fake Mew.  So of course there'd be problems.  Glitches and junk.\"\n\nYou felt your cheeks redden.\n<<set $sibling = \"yes\">>\n\"But not me,\" <<print $friend>> said again.  \"I got the real Mew.  And only me!  My brother was //so// [[jealous]].\""},{"id":"\"Thank you.\"","x":4350,"y":516,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> returns <<print $posspron>> attention to the Nintendo, leaving you [[alone with your thoughts|TimeIncrement]]."},{"id":"toilet","x":1200,"y":912,"cat":"bathroom","out":1,"tags":["Bathroom"],"content":"<<if $snack eq \"no\">>You don't have to go right now.<<endif>><<if ($snack eq \"yes\")>>You go to the bathroom and wash your hands.<<set ($snack = \"no\") and ($bathroomvisit = \"no\")>><<endif>>\n\n[[Are you done here?|Bathroom1]]"},{"id":"to follow","x":3630,"y":2496,"cat":"den","out":1,"tags":["Den"],"content":"The knocking continues persistently as you follow <<print $friend>> to the front of the house.\n<<set $meeting = \"yes\">>\nOutside the pebbeled glass of the front window you can see a tall, dark shadow.\n<<playsound $vgloopGLITCH>>\n<<print $friend>> goes to the door, undoes the deadbolt, and [[cracks it open]]."},{"id":"BathroomHide","x":3810,"y":2199,"cat":"glitch","out":2,"tags":["BathroomGlitch"],"content":"You run down the hall to the bathroom and lock the door behind you.\n<<set $hide = \"yes\">>\nOr at least, this could have been a bathroom.  The walls are bare and white and there's no sink or toilet, but there are some odd featureless white boxes that could stand in for a [[shower|showerHide]] or a [[linen closet|closetHide]]."},{"id":"\"I thought so. Never mind, I'm sorry I brought it up.\"","x":3810,"y":1209,"cat":"den","out":1,"tags":["Den"],"content":"\"Yeah, it's okay,\" <<print $friend>> says, shrugging.\n\n[[You wonder what else you could talk about|Talk to <<print $friend>>]]."},{"id":"Talk about how much you like games","x":3900,"y":615,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> raises an eyebrow at your remark.  \"What do you like about them?\"\n<<set $fem = \"yes\">>\n[[\"The chance to be a different sort of person.\"|\"The challenge! Solving puzzles and stuff.\"]]\n[[\"The challenge! Solving puzzles and stuff.\"]]\n[[\"Being a hero in the stories.\"|\"The challenge! Solving puzzles and stuff.\"]]"},{"id":"\"I don't know.\"","x":3900,"y":219,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> shakes <<print $posspron>> head.  \"It's just, you know, those guys at school.\"\n\n[[Wait|SchoolDudes]].\n[[Nod because you realize what she's getting at|SchoolDudes]]."},{"id":"\"I'm not sure I believe you about your uncle.\"","x":1560,"y":1407,"cat":"den","out":2,"tags":["Den"],"content":"<<print $friend>> takes a moment to respond, as if <<print $pron>> is not quite sure <<print $pron>> heard you correctly.  \"What?\"\n\n[[\"I don't believe your uncle works for Nintendo.\"]]\n[[\"Never mind.\"|EndConvo]]"},{"id":"Fight2","x":5610,"y":2199,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"\"What?\"\n\nYou explain that you and <<print $friend>> aren't getting along right now, and you'd like to go home early.\n\n[[She listens.|Home4]]"},{"id":"bowl of popcorn","x":1740,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"You grab a handful of popcorn.  It's [[buttery and delicious|DenHub]]."},{"id":"\"It was me.\"","x":3900,"y":1803,"cat":"glitch","out":1,"tags":["DenGlitch"],"content":"\"But it sounded like...\"\n\n[[\"I know about the uncle.\"]]"},{"id":"\"I... uh, if you say so.\"","x":4530,"y":120,"cat":"den","out":1,"tags":["Den"],"content":"\"I can take care of myself,\" <<print $pron>> says.  \"I've found a way.\"\n\nYou mean to ask what <<print $pron>> means, but <<print $friend>> has already turned back to the Nintendo, leaving you [[alone with your thoughts|TimeIncrement]]."},{"id":"taken the Gameboy","x":3360,"y":1803,"cat":"vague","out":1,"tags":["vague3"],"content":"It promised you what it promised everyone, every time: the newest games, the best consoles, the best strategies and most talent, the knowledge of tricks and secrets.\n\nA family who could and would provide these things.\n\nYou could play well, play forever, you would always be the best, so long as you [[fed it]]."},{"id":"the fire","x":5430,"y":3387,"cat":"vague","out":1,"tags":["vague3"],"content":"It started in the den, say the papers, where there was known to be a fireplace.  Apparently it was left smoldering in the night.\n\nThere were no survivors.\n\nArson is suspected, since an accelerant would have helped the flames overcome the night's heavy rains, but nothing definitive is ever publicly released [[on this account]].\n\n"},{"id":"BadEnd","x":3900,"y":2694,"cat":"ending","out":1,"tags":[],"content":"<p style=\"color: #000000\"><span style=\"background-color:salmon\">[[Undefined Error|END]]</span></p>"},{"id":"Head inside","x":1560,"y":219,"cat":"default","out":1,"tags":[],"content":"<<fadeinsound $thunder>><<timedinsert 4s>>It is <<print $time>>:<<print $min>> PM.<<endtimedinsert>><<timedgoto \"Dinner\" 10s>>"},{"id":"Storm1","x":4530,"y":1011,"cat":"den","out":5,"tags":["Den"],"content":"<<if ($sad eq \"yes\") and ($forbid eq \"no\")>>\\s\n\"You remember the storm?\" asks <<print $friend>>.\n\n\"Yeah,\" you say, nodding.\n\n\"But no one remembers the storm,\" <<print $pron>> says.\n\n[[\"Could you please stop messing with me?\"]]\n[[\"It was big.  It took down trees.\"]]\n<<endif>>\\s\n<<if ($sad eq \"yes\") and ($forbid eq \"yes\")>>\\s\n\"You remember the storm?\" asks <<print $friend>>.\n\n\"Yeah,\" you say, nodding.\n\n\"But no one remembers the storm,\" <<print $pron>> says.\n\n<<set STOP IT NOW>>\n\nThat voice again.  Someone speaking, but not speaking.  In your head and outside of it.\n\n[[\"Who is that?\"|\"Who?\"]]\n[[\"What is happening here, <<print $friend>>?\"|\"Who?\"]]\n<<endif>>\\s\n<<if ($sad eq \"no\") and ($fight eq \"no\")>>\\s\n\"I don't know what you're talking about,\" says <<print $friend>>.\n\n[[\"You don't remember?\"]]\n<<endif>>\\s\n<<if ($sad eq \"no\") and ($fight eq \"yes\")>>\\s\n<<print $friend>> snorts without looking at you.  \"Whatever,\" <<print $pron>> says.  \"Baby.\"\n\n[[You fall silent|Talk to <<print $friend>>]].\n<<endif>>\\s\n"},{"id":"START","x":3630,"y":1803,"cat":"gameboy","out":6,"tags":["Gameboy"],"content":"> [[POKéDEX|NoTime]]\n  [[POKéMON|NoTime]]\n  [[ITEM|Gameboy]]\n  [[You|Plan]]\n  [[SAVE|NotAGoodIdea]]\n  [[OPTION]]\n  [[EXIT|Nope]]"},{"id":"You take the initiative and throw a punch before <<print $pron>> can go for you again.","x":1650,"y":1704,"cat":"den","out":1,"tags":["Den"],"content":"You shove yourself up off the floor and send your fist into <<print $friend>>'s stomach.\n\nFor a moment you're shocked at what you've done as <<print $pron>> stands there gasping in <<print $posspron>> pajamas, but then suddenly\n<<playsound $HateYou>>\n<<set I HATE YOU>>\n\nyou hear something, or think you hear something, someone shouting, and then you've fallen [[flat on the floor]]."},{"id":"EndDinner","x":1290,"y":516,"cat":"dining","out":1,"tags":["DiningRoom"],"content":"<<playsound $chime>>\"You go along now,\" says <<print $friend>>'s mom, smiling from her side of the table.  \"We'll clean up in here.\"\n\n\"Let's go get the TV ready,\" says <<print $friend>>.\n\nThe two of you leave the dining room and head [[upstairs|Room]].\n<<set $time = $time + 1>>"},{"id":"\"The challenge! Solving puzzles and stuff.\"","x":3810,"y":516,"cat":"den","out":2,"tags":["Den"],"content":"\"Yeah,\" <<print $pron>> says.  \"That's a nice feeling.\"\n\nBut something in <<print $posspron>> voice tells you <<print $pron>>'s thinking about something.\n\n[[\"What's up?\"|CheckIn]]\n[[\"You okay?\"|CheckIn]]\n[[Ignore it and change the topic.|Games]]"},{"id":"On Topicality","x":3900,"y":3981,"cat":"default","out":1,"tags":[],"content":"When I began drafting this game at the beginning of August 2014 it was not topical beyond a general sense.\n\nBut as I write <<cyclinglink \"this note\" \"what proves to be a first draft of this note, since I return to it again and again as the weeks drag on\">>, it is the final week of August, and in the <<cyclinglink \"month\" \"months\" \"years (?)\">> I've been at work, the seemingly nebulous concerns I set out to treat -- the way the modern games industry encouraged and continues to encourage entire generations of children to internalize hierarchies predicated on structures of access maintained by abusive practices of exclusion, deception, and emotional manipulation -- <<cyclinglink \"have erupted\" \"are erupting\">> to the forefront of the \"culture\" in a way more horrific and absurd than anything I could <<cyclinglink \"ever have made up\" \"ever have made up (and in my original draft I had a sentence here suggesting that by the time you read this, it would have ended, which of course turns out to be, unfortunately, not the case)\">>.\n\nWe may not believe in the uncle who works for Nintendo anymore, but he is certainly still at work.\n\nWomen and minority voices are under attack.  The finer details of <<cyclinglink \"the situation\" \"what calls itself GamerGate\" \"this organized harassment campaign\">> are, by this point, both fatiguing and immensely abhorrent.  I will not bother to recount them here.  Suffice it to say: the contingent of players taking up the flag of \"gamers\" are, in many ways, the realization of the thoughts, feelings, and behaviors that constitute the \"enemy\" of this game.\n\nThe fantasy underpinning the \"happy\" ending is that the people trapped in the unhealthy structures cultivated by a combination of late capitalism and videogames can become aware of the way in which they, their friends, in fact the very world around them, are all being devoured alive -- and that we can escape it if we work together.\n\nTo those women who have been terrorized <<cyclinglink \"these past weeks\" \"for as long as they've been prominent in the industry\" \"for as long as they've been alive in a culture that implicitly hates them\">>, to those still here and those who had to step away, to those who are doing and who did their best to make sure we get out of this beast before its jaws close on us, if any of you read this, I am sorry, and I thank you.\n\n[[Back|the author's notes]]."},{"id":"big screen TV","x":1110,"y":615,"cat":"den","out":1,"tags":["Den"],"content":"Sometimes it makes you uncomfortable how much nicer <<print $friend>>'s house is than yours.\n<<set $tv = \"yes\">>\n[[Anyway|DenIntro]].\n"},{"id":"back to the house","x":1470,"y":3189,"cat":"default","out":1,"tags":["HouseOutsideNight"],"content":"<<print $friend>> is standing in the doorway, totally still.  Not screaming, not crying, not doing much of anything.\n\nThe car begins to pull away from the house and as you watch, you see <<print $posspron>> parents appear in the doorway behind <<print $dopron>>.\n\n[[Wave.|LightsOut]]\n   start:    '#22c55e',

  hub:      '#f59e0b',
  glitch:   '#a855f7',
  vague:    '#ec4899',

// ── State ─────────────────────────────────────────────────────────────────────
let activeRoute = null;
let activeRouteSet = null; // Set of passage ids in active route
let activeEdgeSet = null;  // Set of "src→tgt" strings in active route
let selectedNode = null;   // currently selected node datum
let currentStep = 0;      // step index within the active route

// ── D3 setup ──────────────────────────────────────────────────────────────────
const svg = d3.select('#graph');
const g = svg.append('g').attr('id', 'root');

// Arrow markers (one per category color + one for highlighted)
const defs = svg.append('defs');
function addMarker(id, color, size = 6) {
  defs.append('marker')
    .attr('id', id)
    .attr('viewBox', '0 0 10 10')
    .attr('refX', 10)
    .attr('refY', 5)
    .attr('markerWidth', size)
    .attr('markerHeight', size)
    .attr('orient', 'auto')
    .append('path')
    .attr('d', 'M 0 0 L 10 5 L 0 10 z')
    .attr('fill', color);
}
addMarker('arrow-default', '#4a90c4');
addMarker('arrow-lit', '#f59e0b', 8);

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.04, 6])
  .on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);

// ── Build lookup maps ─────────────────────────────────────────────────────────
const nodeById = new Map(NODES.map(n => [n.id, n]));

// ── Draw edges ────────────────────────────────────────────────────────────────
const edgeG = g.append('g').attr('id', 'edges');

// Offset edge endpoints so arrows don't hide under node circles
function edgeCoords(src, tgt) {
  const s = nodeById.get(src), t = nodeById.get(tgt);
  if (!s || !t) return null;
  const dx = t.x - s.x, dy = t.y - s.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const r = nodeRadius(t) + 4;
  return {
    x1: s.x, y1: s.y,
    x2: t.x - dx / dist * r,
    y2: t.y - dy / dist * r,
  };
}

const edgeLines = edgeG.selectAll('line')
  .data(EDGES)
  .join('line')
  .attr('class', 'edge')
  .attr('marker-end', 'url(#arrow-default)')
  .each(function(d) {
    const c = edgeCoords(d[0], d[1]);
    if (c) d3.select(this).attr('x1', c.x1).attr('y1', c.y1).attr('x2', c.x2).attr('y2', c.y2);
  });

// ── Draw nodes ────────────────────────────────────────────────────────────────
function nodeRadius(n) {
  if (n.cat === 'start') return 12;
  if (n.cat === 'ending') return 10;
  if (n.cat === 'hub') return 9;
  return Math.max(4, Math.min(9, 4 + n.out * 0.6));
}

const nodeG = g.append('g').attr('id', 'nodes');

const nodeElems = nodeG.selectAll('g.node')
  .data(NODES)
  .join('g')
  .attr('class', 'node')
  .attr('transform', d => `translate(${d.x},${d.y})`)
  .on('click', (e, d) => {
    e.stopPropagation();
    selectNode(e.currentTarget, d);
  })
  .on('mouseenter', (e, d) => showTooltip(e, d))
  .on('mouseleave', hideTooltip);

// Pulsing selection ring (hidden by default, shown via .node.selected CSS)
nodeElems.append('circle')
  .attr('class', 'sel-ring')
  .attr('r', d => nodeRadius(d) + 4)
  .attr('fill', 'none')
  .attr('stroke', '#ffffff')
  .attr('stroke-width', 1.5);

nodeElems.append('circle')
  .attr('class', 'node-circle')
  .attr('r', d => nodeRadius(d))
  .attr('fill', d => CAT_COLOR[d.cat] || CAT_COLOR.default)
  .attr('stroke', d => d.cat === 'ending' ? '#fff' : 'none')
  .attr('stroke-width', 1.5);

// Invisible hit-area on top — much larger than the visible dot so small nodes are easy to click
nodeElems.append('circle')
  .attr('class', 'hit-area')
  .attr('r', d => Math.max(nodeRadius(d) + 10, 18))
  .attr('fill', 'transparent')

// Label for start / endings / hubs only
nodeElems.filter(d => ['start','ending','hub'].includes(d.cat))

  .attr('y', d => -nodeRadius(d) - 4)
