<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UWWFN — Route Map</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0f1117;color:#e2e8f0;font-family:system-ui,sans-serif;font-size:13px}

#app{display:flex;flex-direction:column;height:100vh}
#header{flex-shrink:0;display:flex;align-items:center;gap:16px;padding:10px 16px;background:#161b27;border-bottom:1px solid #1e2a3a}
#header h1{font-size:16px;font-weight:700;color:#f8fafc;white-space:nowrap}
#header .stats{color:#64748b;font-size:12px;white-space:nowrap}
#search{flex:1;max-width:260px;padding:5px 10px;background:#0f1117;border:1px solid #1e2a3a;border-radius:6px;color:#e2e8f0;font-size:12px;outline:none}
#search:focus{border-color:#3b82f6}
#search::placeholder{color:#475569}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}

#body{flex:1;display:flex;min-height:0}

/* Resizers */
.resizer{flex-shrink:0;background:#1e2a3a;z-index:20;transition:background .15s}
.resizer-x{width:4px;cursor:col-resize}
.resizer-x:hover,.resizer-x.dragging{background:#3b82f6}
.resizer-y{height:5px;cursor:row-resize;width:100%}
.resizer-y:hover,.resizer-y.dragging{background:#3b82f6}

/* Sidebar */
#sidebar{width:240px;min-width:0;flex-shrink:0;display:flex;flex-direction:column;background:#0d1117;border-right:none;overflow:hidden;transition:width .18s}
#sidebar.collapsed{width:34px!important}
#sidebar.collapsed .sidebar-body{display:none}
#sidebar.collapsed #btn-reset-route{display:none}
#sidebar.collapsed .sidebar-title{display:none}
#sidebar-header{padding:6px 8px;border-bottom:1px solid #1e2a3a;color:#94a3b8;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.sidebar-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btn-sidebar-toggle{width:22px;height:22px;flex-shrink:0;background:#161b27;border:1px solid #1e2a3a;border-radius:4px;color:#94a3b8;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:background .1s,color .1s}
#btn-sidebar-toggle:hover{background:#1e2a3a;color:#e2e8f0}
#btn-reset-route{padding:3px 8px;background:#7f1d1d;border:1px solid #ef4444;border-radius:5px;color:#fca5a5;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
#btn-reset-route:hover:not(:disabled){background:#991b1b;border-color:#f87171;color:#fff}
#btn-reset-route:disabled{opacity:.35;cursor:default}
.sidebar-body{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#route-list{flex:1;overflow-y:auto;padding:4px 0}
#route-list::-webkit-scrollbar{width:4px}
#route-list::-webkit-scrollbar-track{background:transparent}
#route-list::-webkit-scrollbar-thumb{background:#1e2a3a;border-radius:2px}

.ending-group{}
.ending-label{padding:6px 10px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:5px;position:sticky;top:0;z-index:1;background:#0d1117;cursor:pointer;user-select:none}
.ending-label:hover{background:#111827}
.ending-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ending-label-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.8}
.ending-toggle{font-size:10px;color:#475569;flex-shrink:0;line-height:1;transition:transform .15s}
.ending-routes{}
.ending-routes.collapsed{display:none}
.route-item{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 12px;cursor:pointer;border-radius:4px;margin:0 4px;transition:background .1s}
.route-item:hover{background:#161b27}
.route-item.active{background:#1e2a3a}
.route-item.sel-checked{background:#0f1e35}
.route-num{font-size:11px;font-weight:700;color:#475569;min-width:28px;font-variant-numeric:tabular-nums}
.route-steps{font-size:11px;color:#64748b;margin-left:auto;white-space:nowrap}
/* Route color swatch shown when checked */
.route-color-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:none;transition:background .15s}
.route-item.sel-checked .route-color-dot{display:inline-block}
/* Route checkbox */
.route-cb{width:14px;height:14px;flex-shrink:0;accent-color:#3b82f6;cursor:pointer;margin-right:2px}
.group-cb{width:12px;height:12px;flex-shrink:0;accent-color:#3b82f6;cursor:pointer}
/* Selection toolbar */
#select-toolbar{flex-shrink:0;display:none;align-items:center;gap:6px;padding:7px 10px;border-top:1px solid #1e3a5f;background:#0a1628;flex-wrap:wrap}
#select-toolbar.visible{display:flex}
#select-count{font-size:11px;font-weight:700;color:#93c5fd;flex:1;min-width:0;white-space:nowrap}
.sel-btn{padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;border:1px solid}
.sel-btn-txt{background:#1c1408;border-color:#78350f;color:#fcd34d}
.sel-btn-txt:hover{background:#292107;border-color:#f59e0b;color:#fef08a}
.sel-btn-html{background:#164e13;border-color:#22c55e;color:#86efac}
.sel-btn-html:hover{background:#166534;border-color:#4ade80;color:#bbf7d0}
.sel-btn-clear{background:#1a0a0a;border-color:#7f1d1d;color:#fca5a5}
.sel-btn-clear:hover{background:#291010;border-color:#ef4444;color:#fff}

/* Graph */
#graph-wrap{flex:1;position:relative;overflow:hidden;background:#0a0d14}
svg#graph{width:100%;height:100%;cursor:grab}
svg#graph:active{cursor:grabbing}

.node{cursor:pointer}
.node circle{transition:r .1s,stroke .1s,stroke-width .1s}
.node:hover .node-circle{filter:brightness(1.4)}
.node text{pointer-events:none;user-select:none;font-family:system-ui,sans-serif}
/* Selection ring — overrides dimmed state so selected node is always visible */
.node.selected .node-circle{stroke:#ffffff !important;stroke-width:3px !important;opacity:1 !important;filter:drop-shadow(0 0 8px currentColor) !important}
.sel-ring{display:none;pointer-events:none}
.node.selected .sel-ring{display:block}
@keyframes sel-pulse{0%{r:0;opacity:.7}100%{r:22px;opacity:0}}
.node.selected .sel-ring{animation:sel-pulse 1.6s ease-out infinite}

.edge{stroke:#4a90c4;stroke-width:1.2;fill:none;opacity:.65}
.edge.dimmed{opacity:.05}
.edge.lit{stroke-width:2.5;opacity:1}
/* Hover preview — dashed, semi-transparent white overlay */
.edge.preview{stroke:#e2e8f0;stroke-width:2;stroke-dasharray:6 3;opacity:.75;animation:dash-march .6s linear infinite}
@keyframes dash-march{to{stroke-dashoffset:-18}}
.node-circle.preview{stroke:#e2e8f0 !important;stroke-width:2px !important;filter:drop-shadow(0 0 6px #e2e8f0) !important;opacity:1 !important}

.node-circle.dimmed{opacity:.1}
.node-circle.lit{filter:drop-shadow(0 0 4px currentColor)}
.node-label.dimmed{opacity:.05}
/* Route path hover tooltip */
#route-path-preview{position:fixed;z-index:9999;background:rgba(13,17,23,.97);border:1px solid #1e3a5f;border-radius:8px;padding:10px 14px;max-width:320px;pointer-events:none;display:none;box-shadow:0 8px 32px rgba(0,0,0,.6)}
#route-path-preview .rpp-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#475569;margin-bottom:8px}
#route-path-preview .rpp-path{display:flex;flex-wrap:wrap;gap:3px;align-items:center;max-height:140px;overflow:hidden}
.rpp-node{padding:2px 7px;background:#1e2a3a;border-radius:999px;font-size:10px;color:#cbd5e1;white-space:nowrap}
.rpp-node.rpp-start{background:#14532d;color:#86efac}
.rpp-node.rpp-end{background:#7c2020;color:#fca5a5}
.rpp-arrow{color:#334155;font-size:9px;flex-shrink:0}

#controls{position:absolute;top:16px;left:16px;display:flex;flex-direction:column;gap:6px}
.ctrl-btn{width:32px;height:32px;background:#161b27;border:1px solid #1e2a3a;border-radius:6px;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .1s}
.ctrl-btn:hover{background:#1e2a3a;color:#e2e8f0}

/* Detail panel */
#detail{width:260px;flex-shrink:0;display:flex;flex-direction:column;background:#0d1117;border-left:1px solid #1e2a3a;overflow:hidden}
#detail-header{flex-shrink:0}
#detail-inner{flex:1;overflow-y:auto;padding:14px}
#detail-inner::-webkit-scrollbar{width:4px}
#detail-inner::-webkit-scrollbar-thumb{background:#1e2a3a;border-radius:2px}
#detail h2{font-size:13px;font-weight:700;color:#f1f5f9;margin-bottom:8px;line-height:1.4;word-break:break-word}
.detail-meta{margin-bottom:12px}
.detail-meta span{display:block;font-size:11px;color:#64748b;margin-bottom:2px}
.detail-meta b{color:#94a3b8}
.link-list{display:flex;flex-direction:column;gap:3px;margin-top:8px}
.link-chip{padding:3px 8px;background:#161b27;border-radius:4px;font-size:11px;color:#93c5fd;cursor:pointer;word-break:break-word;line-height:1.4}
.link-chip:hover{background:#1e3a5f}
.tag-chip{display:inline-block;padding:1px 6px;border-radius:999px;font-size:10px;background:#1e2a3a;color:#94a3b8;margin:2px}
#detail-empty{padding:24px 14px;color:#475569;font-size:12px;line-height:1.6}

/* Permanent nav bar — always visible at bottom of graph */
#nav-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(13,17,23,.97);border-top:none;display:flex;flex-direction:column}
#nav-bar-top{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-shrink:0}
#route-strip-title{font-size:11px;font-weight:600;color:#94a3b8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn{padding:6px 18px;background:#1d4ed8;border:1px solid #3b82f6;border-radius:6px;color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
.nav-btn:hover:not(:disabled){background:#2563eb;border-color:#93c5fd}
.nav-btn:disabled{opacity:.35;cursor:default;background:#1e3558;border-color:#2d4a7a}
#step-counter{font-size:12px;font-weight:700;color:#e2e8f0;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}
#btn-export{padding:6px 14px;background:#164e13;border:1px solid #22c55e;border-radius:6px;color:#86efac;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
#btn-export:hover:not(:disabled){background:#166534;border-color:#4ade80;color:#bbf7d0}
#btn-export:disabled{opacity:.3;cursor:default}
#btn-export-txt{padding:6px 14px;background:#1c1408;border:1px solid #78350f;border-radius:6px;color:#fcd34d;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
#btn-export-txt:hover:not(:disabled){background:#292107;border-color:#f59e0b;color:#fef08a}
#btn-export-txt:disabled{opacity:.3;cursor:default}
/* Route step chips strip — hidden until route selected */
#route-strip{display:none;flex-wrap:wrap;gap:4px;padding:6px 14px 8px;max-height:60px;overflow-y:auto;border-top:1px solid #1e2a3a}
#route-strip.visible{display:flex}
.step-chip{padding:2px 8px;background:#1e2a3a;border-radius:999px;font-size:10px;color:#cbd5e1;cursor:pointer;white-space:nowrap;transition:background .1s,color .1s}
.step-chip:hover{background:#2d3f52;color:#f1f5f9}
.step-chip.is-ending{background:#7c2020;color:#fca5a5}
.step-chip.is-start{background:#14532d;color:#86efac}
.step-chip.current-step{background:#78350f;color:#fbbf24;outline:1px solid #f59e0b;font-weight:700}

/* Visual novel content renderer */
.passage-text{margin-top:10px;padding-top:10px;border-top:1px solid #1e2a3a;font-size:12px;line-height:1.75;color:#cbd5e1}
.passage-text font{font-size:inherit !important}
.passage-text center{text-align:center}
.passage-text b,.passage-text strong{color:#f1f5f9}
.passage-text em,.passage-text i{color:#94a3b8;font-style:italic}
.choice-chip{display:block;width:100%;text-align:left;margin:4px 0;padding:5px 10px;background:#0f2236;border:1px solid #1e3a5f;border-radius:6px;color:#60a5fa;font-size:11px;cursor:pointer;line-height:1.4;word-break:break-word;transition:background .1s,border-color .1s}
.choice-chip:hover{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd}
.var-ref{color:#a78bfa;font-style:italic;font-size:11px}
.auto-nav{display:block;margin:4px 0;padding:3px 8px;background:#1a2010;border-left:2px solid #4ade80;color:#86efac;font-size:10px;font-style:italic}
.branch-mark{color:#475569;font-size:10px;padding:0 3px;user-select:none}
.passage-label{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#475569;margin-bottom:6px}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>UWWFN — Route Map</h1>
    <span class="stats" id="stat-text">Loading…</span>
    <input id="search" type="text" placeholder="Search passage…" autocomplete="off" spellcheck="false">
    <span style="margin-left:auto;font-size:11px;color:#334155">Scroll to zoom · Drag to pan · Click node for detail</span>
  </div>
  <div id="body">
    <aside id="sidebar">
      <div id="sidebar-header">
        <button id="btn-sidebar-toggle" title="Collapse sidebar">◀</button>
        <span class="sidebar-title">Routes</span>
        <button id="btn-reset-route" disabled onclick="resetRoute()">× Reset</button>
      </div>
      <div class="sidebar-body">
        <div id="route-list"></div>
        <div id="select-toolbar">
          <span id="select-count">0 selected</span>
          <button class="sel-btn sel-btn-txt" onclick="exportSelected('txt')">↗ TXT</button>
          <button class="sel-btn sel-btn-html" onclick="exportSelected('html')">↗ HTML</button>
          <button class="sel-btn sel-btn-clear" onclick="clearSelection()">✕ Clear</button>
        </div>
      </div>
    </aside>
    <div class="resizer resizer-x" id="sidebar-resizer"></div>

    <div id="graph-wrap">
      <svg id="graph"></svg>
      <div id="controls">
        <button class="ctrl-btn" id="btn-zoom-in" title="Zoom in">+</button>
        <button class="ctrl-btn" id="btn-zoom-out" title="Zoom out">−</button>
        <button class="ctrl-btn" id="btn-reset" title="Reset view" style="font-size:12px">⌂</button>
      </div>
      <div id="nav-bar">
        <div class="resizer resizer-y" id="nav-resizer"></div>
        <div id="nav-bar-top">
          <button class="nav-btn" id="btn-prev" disabled onclick="navigateStep(-1)">← Prev</button>
          <span id="step-counter">— / —</span>
          <button class="nav-btn" id="btn-next" disabled onclick="navigateStep(1)">Next →</button>
          <span id="route-strip-title">Select a route from the sidebar</span>
          <button id="btn-export" disabled onclick="exportRoute()">↗ Export HTML</button>
          <button id="btn-export-txt" disabled onclick="exportRouteTxt()">↗ Export TXT</button>
        </div>
        <div id="route-strip"></div>
      </div>
    </div>

    <div class="resizer resizer-x" id="detail-resizer"></div>
    <aside id="detail">
      <div id="detail-header" style="flex-shrink:0;padding:8px 12px;border-bottom:1px solid #1e2a3a;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#475569;display:flex;align-items:center;gap:6px">
        <span id="detail-sel-dot" style="width:8px;height:8px;border-radius:50%;background:#475569;flex-shrink:0"></span>
        <span id="detail-header-text">No node selected</span>
      </div>
      <div id="detail-inner">
        <div id="detail-empty">Click any node in the graph to see its passage text and outgoing links.</div>
      </div>
    </aside>
  </div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const NODES=[{"id":"NotAGoodIdea","x":3540,"y":1704,"cat":"gameboy","out":1,"tags":["Gameboy"],"content":"It's probably not a good idea to save when\n\n<<set \n\nS̳᷅᷅ͨ᷅᷅͝T᷅᷅͢O᷅̎᷅P᷅ͫ᷅ ᷅᷅͢T᷅͐᷅H᷅̎᷅I̸᷅᷅S̮᷅᷅ ᷅̅᷅C᷅ͨ᷅H᷅᷄᷅I᷅᷅͝L̸᷅᷅D᷅᷉᷅>>\n\nthings are getting so messed up.\n\n[[Back|START]]."},{"id":"Snack","x":2640,"y":1902,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"<<set $snack = \"yes\">>You grab your snack and [[exit the kitchen|ToTheDen]]."},{"id":"showerHide","x":3990,"y":2199,"cat":"glitch","out":1,"tags":["BathroomGlitch"],"content":"You slip into the plain white box that is about the size of a shower.  From the front of the house, you can hear the [[front door slam open]].<<unloopsound $knock>>"},{"id":"Attempt to talk to them","x":2820,"y":1902,"cat":"dining","out":1,"tags":["DiningRoom"],"content":"[[\"Hello?\"|Speak1]]\n[[\"Hi.\"|Speak1]]\n[[\"Are you okay?\"|Speak1]]"},{"id":"Bye","x":1380,"y":219,"cat":"default","out":1,"tags":["OutsideHouseStormy"],"content":"After you part your mom drives down the street, disappearing around the corner.\n\nYou turn back to <<print $friend>>'s house.  The lights inside are glowing warmly.  You can see <<print $friend>> waving at you from <<print $posspron>> bedroom on the second floor.\n\n[[Head inside]]."},{"id":"Go anyway","x":3540,"y":1902,"cat":"glitch","out":1,"tags":["KitchenGlitch"],"content":"<<set WHAT>>\n<<playsound $Warning>>\nYou go to the kitchen.\n\n<<set NO CHILD>>\n\nThere is not [much of a \n\n<<set T̔H͙I͖S̑ ̟I̔S͋ ̓N͠O᷇T̃ ͂A̜L̨L᷉O͏W̺E̲D̩ ̷̜ͤC̲H̀I᷀L̈́D͇>>\n<<set $survive = \"yes\">>\n[[Ignore the uncle|EndGame1]].\n[[Tell the uncle to be quiet|EndGame1]]."},{"id":"PickUp2","x":5430,"y":2397,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"She sighes heavily.  \"Of course,\" she says.  \"I'll call the sitter. She'll probably be there in an hour.  Now, really, I have to go.\"\n\nShe hangs up.\n\n[[Return to the den and pack your things.|Leaving1]]"},{"id":"\"Isn't that a little weird?\"","x":1740,"y":1209,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> gives you a look you don't like very much.  \"How would you know?\" <<print $pron>> asks.  \"You don't even have an uncle.\"\n\n[[\"Yeah, I guess so.\"|EndConvo]]\n[[(Don't pursue the topic further.)|EndConvo]]"},{"id":"what it was, and what it did","x":3360,"y":1704,"cat":"vague","out":1,"tags":["vague3"],"content":"How many times had you not made it through the night?  How many of your friends had gone before you, would come after you?\n\nHow many had [[taken the Gameboy]]?"},{"id":"(Punch <<print $friend>>.)","x":5160,"y":2199,"cat":"den","out":2,"tags":["Den"],"content":"Your knuckles connect with <<print $posspron>> jaw and <<print $pron>> goes sprawling on the hardwood floor.\n<<if $fight eq \"no\">><<set $fight = \"yes\">><<endif>>\nYou're not sure if <<print $pron>> was expecting it or not, but <<print $pron>> doesn't try to get up: <<print $pron>> just lies there, looking at you.\n\n[[(Say nothing.)|TimePasses]]\n[[\"I am going home.\"|GoingHome2]]"},{"id":"New Game","x":3540,"y":3090,"cat":"vague","out":1,"tags":["vague4"],"content":"You and <<print $friend>> defeated the uncle who works for Nintendo.\n\n[[Back|credits]]."},{"id":"\"I don't believe your uncle works for Nintendo.\"","x":1560,"y":1506,"cat":"den","out":2,"tags":["Den"],"content":"You think you've finally done it.  <<print $friend>> stands up, fists clenched at <<print $posspron>> sides, mouth twisting horribly as <<print $pron>> struggles to say something.\n\nYou watch as <<print $pron>> takes a step toward you, and...\n\n[[...you involuntarily flinch.]]\n[[...you clench your teeth and wait.]]"},{"id":"sound credits","x":3810,"y":3387,"cat":"vague","out":1,"tags":["vague4"],"content":"The following sounds were retrieved from FreeSound.org and edited for this project under Creative Commons licensing.\n\n[[calm and storm|http://www.freesound.org/people/csengeri/sounds/192253/]]\n[[clock tick|http://www.freesound.org/people/urbaneguerilla/sounds/161442/]]\n[[clock chime|http://www.freesound.org/people/NightVoice/sounds/234268/]]\n[[knocking|http://www.freesound.org/people/Macif/sounds/194365/]]\n[[rolling thunder|http://www.freesound.org/people/CGEffex/sounds/121571/]]\n[[car honk|http://www.freesound.org/people/ceberation/sounds/235506/]]\n[[creak|http://www.freesound.org/people/Jedimichael/sounds/83877/]]\n[[slamming door|http://www.freesound.org/people/bmusic92/sounds/232931/]]\n\n[[Back|credits]].\n\n"},{"id":"Kitchen1","x":2190,"y":1704,"cat":"kitchen","out":3,"tags":["Kitchen"],"content":"<<stopsound $tick>><<stopsound $ambient>><<if ($time lt 8) and ($frozenNPCs eq \"no\")>>You head toward the kitchen, thinking you may grab a soda from the fridge.  On the way, you have to head through the dining room.\n\n<<print $friend>>'s mom and dad are [[still there]].<<else>>Passing <<if $frozenNPCs eq \"yes\">>hesitantly <<endif>>through the <<if $frozenNPCs eq \"yes\">>now <<endif>>empty dining room, you enter the kitchen, which is also deserted right now.\n\n[[Fridge]].\n[[Go back to the den|ToTheDen]].<<endif>>"},{"id":"to check it out","x":5250,"y":3189,"cat":"burned","out":1,"tags":["HouseBurned"],"content":"Parts of the house still stand, walls and beams blackened by the flames.\n\nYellow caution tape has been looped around the outside, and the rubble hasn't yet been totally cleared out by the city.\n\n[[You decide to investigate]]."},{"id":"\"Something isn't right here.\"","x":4170,"y":1506,"cat":"den","out":2,"tags":["Den"],"content":"<<print $friend>> begins shaking <<print $posspron>> head, biting <<print $posspron>> lip and making a choking noise in the back of <<print $posspron>> throat.\n\n[[(Comfort.)]]\n[[(Watch.)|Forbid]]"},{"id":"DenHub","x":1830,"y":714,"cat":"den","out":17,"tags":["Den"],"content":"<<loopsound $ambient>><<loopsound $rain>><<if $time eq 12>><<goto \"Arrival\">><<endif>><<if $counter eq 1>><<set $min = \"30\">><<endif>><<if $counter gt 1>><<goto \"TimeIncrement\">><<endif>><<if ($time eq 9) and ($popcorn eq \"no\")>><<goto \"Popcorn\">><<endif>><<if ($time eq 10) and ($raining eq \"no\")>><<goto \"StormStart\">><<endif>>In the corner [[the grandfather clock]] is ticking softly.  Through a nearby set of patio doors you can see <<if $raining eq \"yes\">>it's dark and rainy<<endif>><<else>><<if ($time gte 8) and ($raining eq \"no\")>>it's fully dark outside<<endif>><<else>><<if $time lt 8 and ($raining eq \"no\")>>it's getting quite dark<<endif>>.\n\n[[Framed pictures]] line the walls.\n\n<<if $sad eq \"no\">><<print $friend>> is parked in front of the large TV, playing something on the Nintendo 64.<<else>><<stopsound $ambient>><<print $friend>> is ignoring the Nintendo and is sitting on the floor, doing nothing.<<endif>><<if $popcorn eq \n\"yes\">>  There is a [[bowl of popcorn]] on the floor.<<endif>>\n<<if ($snack eq \"yes\") and ($time gte 10) and ($distress lt 3) and ($bathroomvisit eq \"no\")>>\nYou feel like you might have to go to the bathroom.\n<<endif>>\\s\n<<if ($snack eq \"yes\") and ($time gte 10) and ($distress gte 3) and ($bathroomvisit eq \"no\")>>\\s\nYou regret that kitchen trip earlier.  Now you have to go to the bathroom.\n<<endif>>\\s\n\n[[Talk to <<print $friend>>]].\n<<if $sad eq \"no\">>[[Watch <<print $friend>> play]].<<endif>>\n[[Go to the bathroom|Bathroom1]].\n[[Go to the kitchen|Kitchen1]].\n<<if ($house eq \"no\") and ($oldstorm eq \"no\")>>\\s\n[[Think about <<print $friend>>'s uncle]].\n<<endif>>\\s\n<<if ($sibling eq \"no\") and (($house eq \"yes\") or ($oldstorm eq \"yes\"))>>\\s\n[[Remember your own Mew]].\n<<endif>>\\s\n<<if ($frozenNPCs eq \"yes\") and ($Diningclear eq \"no\") and ($time lt 9)>>\\s\n[[Tell <<print $friend>> about <<print $posspron>> parents]].\n<<endif>>\\s\n<<if $distress gte 4>>\\s\n<<if $sad eq \"yes\">>[[Call your mom|GoingHome3]].<<else>>[[Call your mom]].\n<<endif>><<endif>>\\s\n<<if ($time gte 9) and ($business eq \"no\")>>\\s\n[[Ask about uncle's visit]].\n<<endif>>"},{"id":"END","x":3450,"y":3090,"cat":"hub","out":1,"tags":["vague4"],"content":"<<stopallsound>><center>[[the uncle who works for nintendo|credits]]</center>\n<<silently>><<set $time = 6>>\n<<set $min = \"00\">>\n<<set $counter = 0>>\n<<set $distress = 0>>\n<<set $tv = \"no\">>\n<<set $beer = \"no\">>\n<<set $raining = \"no\">>\n<<set $house = \"no\">>\n<<set $oldstorm = \"no\">>\n<<set $frozenNPCs = \"no\">>\n<<set $snack = \"no\">>\n<<set $Diningclear = \"no\">>\n<<set $sibling = \"no\">>\n<<set $disavow = \"no\">>\n<<set $brocovered = \"no\">>\n<<set $popcorn = \"no\">>\n<<set $business = \"no\">>\n<<set $sad = \"no\">>\n<<set $fight = \"no\">>\n<<set $forbid = \"no\">>\n<<set $kitchglitch = \"no\">>\n<<set $bathroomvisit = \"no\">>\n<<set $rain = \"PreStorm.mp3\">>\n<<set $fem = \"no\">><<endsilently>>"},{"id":"close to crying","x":1920,"y":1704,"cat":"den","out":2,"tags":["Den"],"content":"[[\"Are you okay?\"|...you involuntarily flinch.]]\n[[\"Hey, I'm sorry, I didn't mean it.\"|...you involuntarily flinch.]]\n[[(Say nothing.)|...you involuntarily flinch.]]\n[[(Throw a punch.)|You take the initiative and throw a punch before <<print $pron>> can go for you again.]]"},{"id":"\"Yes, yes, thank you!\"","x":1020,"y":2595,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"\"Of course,\" she says, with the hint of a sigh.  \"I'll call her now, okay?  She'll be there in an hour.  Be safe.\"\n\nShe hangs up.\n\n[[Return to the den and pack your things.|Leaving]]"},{"id":"\"The storm.  It happened a few weeks ago, it was huge, it took down trees...\"","x":4620,"y":912,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> shakes <<print $posspron>> head.  \"If it was important I'm sure I would have remembered it,\" <<print $pron>> says.\n\n[[You fall silent|Talk to <<print $friend>>]]."},{"id":"other things","x":1560,"y":516,"cat":"vague","out":1,"tags":["vague1"],"content":"All the major stuff: an old SNES, a PlayStation, a Dreamcast...\n\nBut some other things, too.  Things you don't really recognize.  A large black box with green highlights, a smaller purple one, a strange white and yellow tower with what look like gloves resting on hooks on either side, a compact white cone...\n\n[[\"What are those?\"|Room3]]\n[[\"Those look cool.\"|Room3]]"},{"id":"running upstairs","x":1200,"y":3189,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> continually runs up and down the stairs, bringing you games and consoles, while you pack up your things.\n\nEvery time <<print $pron>> presents something new you ignore <<print $dopron>> or brush it off with an uncaring shrug.\n\n\"Please,\" <<print $friend>> says, \"just stay! Stay the night, please.\"\n\n[[Outside you hear a car horn honk]]."},{"id":"\"Who?\"","x":5070,"y":1110,"cat":"vague","out":4,"tags":["vague2"],"content":"\"He... he came out of the storm.  I was home alone,\" <<print $friend>> begins, <<print $posspron>> eyes growing distant.\n<<loopsound \"https://s3.amazonaws.com/thiscoldnight/Storm.mp3\">><<playsound $thunder>>\n\"Mom was at work.  Dad was... Dad was out at the bar...\"\n\n[[(Listen.)]]\n[[\"You were alone.\"]]\n[[\"I remember you were alone a lot.\"|\"You were alone.\"]]\n<<if ($disavow eq \"no\") and ($brocovered eq \"no\")>>\\s\n[[\"You had a brother, didn't you?\"]]\n<<endif>>\\s\n<<if ($disavow eq \"no\") and ($brocovered eq \"yes\")>>\\s\n[[\"Where was your brother?\"]]\n<<endif>>"},{"id":"here","x":840,"y":219,"cat":"default","out":1,"tags":[],"content":"This is a horror game.\n\nIt does not make use of \"screamers\" or jump scares.  Sound effects are used for tension and atmosphere.\n\nSome playthroughs may encounter plot points concerning a possible suicide.\n\nThematically, many aspects of this game may recall the emotional abuse experienced by children at the hands of adults and, very often, other children.\n\n[[Back.|Start]]"},{"id":"You take a moment to be dazed.","x":1830,"y":1506,"cat":"den","out":1,"tags":["Den"],"content":"You lie there, expecting another punch or a kick, but to your surprise nothing happens.\n\nSlowly you sit up to see <<print $friend>> standing there, arms still stiff at <<print $posspron>> sides, breathing heavily.\n\nYou realize <<print $pron>> is [[close to crying]]."},{"id":"All Unsaved Data Will Be Lost","x":3720,"y":3090,"cat":"vague","out":1,"tags":["vague4"],"content":"You went home early, and it was lucky you did: <<print $friend>> and <<print $posspron>> family died in a house fire that night.\n\n[[Back|credits]]."},{"id":"front door slam open","x":4080,"y":2397,"cat":"glitch","out":1,"tags":["BathroomGlitch"],"content":"<<playsound $slam>>After that you don't hear anything except\n<<playsound $Snarling>><<playsound $FoundYou>>\n<<set CHILD>>\n\nthe rain.  No, not just the rain, but that voice in the back of your head, like\n\n<<set I AM COMING FOR YOU CHILD>>\n\nlike something you [[can't even begin to describe]].\n"},{"id":"Tuesday","x":2640,"y":2793,"cat":"vague","out":1,"tags":["vague3"],"content":"Or [[Wednesday]]."},{"id":"Reassuring","x":4260,"y":1803,"cat":"glitch","out":1,"tags":["DenGlitch"],"content":"<<print $friend>> shakes <<print $pron>> head <<timedinsert 2s>><<set S᷂᷂̓T̵᷂᷂O᷂᷂͐P᷂᷂͋ ᷂̜᷂T᷂͉᷂̦᷂᷂̎H᷂᷂͂I᷂̣᷂S᷂᷂̽ ᷂͍᷂N᷂᷂̕O᷂᷂ͣW᷂͈᷂ ̴᷂᷂C᷂᷂͘Ḩ᷂᷂I᷂᷂̕L᷂᷂̃D᷂᷂᷃Ř᷂᷂Ę᷂᷂N᷂᷂̋\n\n>><<endtimedinsert>>in disbelief.  \"What are you here for? What are you doing?\"\n<<stopsound $rain>><<playsound $StormGLITCH>>\nThe rain outside increases in tempo, or <<timedinsert 2s>><<set \nB̨̢̨͗͗͗͗Ą̧̨͗͗͗͗D̨̨͈͗͗͗͗ ̨̨̗͗͗͗͗C̨̨͗͗̂͗͗H̨̨͕͗͗͗͗Į̨͗͗ͬ͗͗L̨̨͗͗͗͗͞D̨̨͗͗̌͗͗R̨̨͗͗͌͗͗Ę̨̹͗͗͗͗N̨̨͗͗᷃͗͗ ̨̨̨̨͗͗̇͗͗̃͗͗͗͗͞B̨̨͗͗ͯ͗͗Ą̨͗͗͒͗͗D̨̨͗͗̌͗͗ ̨̨͗͗᷉͗͗B̨̨͗͗͗͗͘Ą̨͗͗̀͗͗D̨̨͗͗᷆͗͗ ̨̨̠͗͗͗͗B̨̨͗͗͑͗͗Ą̨͗͗ͬ͗͗D̷̨̨͗͗͗͗\n>><<endtimedinsert>>stops sounding exactly like rain.\n\n[[\"I came back to save you.\"]]\n[[\"I came so we can stop it.\"|\"I came back to save you.\"]]"},{"id":"glassy and empty her eyes are","x":4440,"y":3090,"cat":"ending","out":1,"tags":["vague3"],"content":"\"Don't you remember?\" she asks.  \"Your uncle is coming over for dinner, to celebrate his new job.\"\n<<set $end = \"yes\">>\n[[END]]"},{"id":"Watch <<print $friend>> play","x":3000,"y":615,"cat":"den","out":15,"tags":["Den"],"content":"<<if ($time eq 7) and ($distress lte 0)>>\\s\n<<print $friend>> is playing something that looks a little like <<print either (\"Banjo-Kazooie\", \"Goldeneye\", \"Star Fox\", \"Mario\", \"Diddy Kong Racing\", \"Zelda\", \"Bomberman\", \"Shadows of the Empire\")>>, but it's not a game you're familiar with.  \n\nYou watch for a while, and eventually <<print $friend>> turns to look at you.  \"Come on, you wanna play?\"\n\n[[Play solo]].\n[[Play co-op]].\n<<endif>>\\s\n<<if ($time eq 8) and ($distress lte 0)>>\\s\nYou and <<print $friend>> decide to switch games.  Since <<print $posspron>> library is so large, <<print $pron>> picks.\n\n\"You play this one,\" <<print $pron>> says.\n\n[[Play|Play1]].\n<<endif>>\\s\n<<if ($time eq 9) and ($distress lte 0)>>\\s\n<<print $friend>> takes charge of the console again.\n\n\"Watch this,\" <<print $pron>> says.\n\nOn screen, Link is in the Temple of Time.  <<print $friend>> heads to a corner of the map and, after walking back and forth for a few seconds, [[phases through the wall]].\n<<endif>>\\s\n<<if ($time eq 10) and ($distress lte 0)>>\\s\nYou and <<print $friend>> play a game of Mario Kart.  <<print $friend>> wins the first track pretty easily and you start to feel like this was a mistake -- <<print $pron>> is just too competitive -- but you actually win during the second track.\n\n[[\"Eat my dust!\"]]\n[[\"That's what you get for playing as Bowser.\"]]\n[[\"Did you let me win?\"]]\n<<endif>>\\s\n<<if ($time eq 11) and ($distress lte 0)>>\\s\n\"My uncle will be here soon,\" says <<print $friend>>, looking at the clock.\n\n[[\"Yeah?\"]]\n[[\"Should we get stuff ready for him?\"|\"Yeah?\"]]\n<<endif>>\\s\n<<if ($time eq 7) and ($distress gte 1) and ($distress lte 5)>>\\s\nYou try to relax by watching <<print $friend>> play a game.\n\nAfter a moment, though, <<print $pron>> looks over at you.  \"You play this one,\" <<print $pron>> says.\n\n[[Play|Play2]].\n<<endif>>\\s\n<<if ($time eq 8) and ($distress gte 1) and ($distress lte 5)>>\\s\n<<print $friend>> decides you should play the next game alone.\n\nIt's pretty boring.  You're at a party having a conversation with a man in a business suit, but for some reason you can't move the camera up to see above his mouth.  He's always smiling.\n\nHe tells you a story about how people always mistake him for [[someone else]].\n\n[[Play|Play2]].\n<<endif>>\\s\n<<if ($time eq 9) and ($distress gte 1) and ($distress lte 5)>>You're feeling anxious and you apparently are showing it.  <<print $friend>> looks at you and bites <<print $posspron>> lip.\n\n\"Watch this,\" <<print $pron>> says.\n\nOn screen, the game's main character is in a car on a crowded street in what looks like a virtual New York City.  <<print $friend>> revs up and [[begins mowing down pedestrians, giggling]].<<endif>>\\s\n<<if ($time eq 10) and ($distress gte 1) and ($distress lte 5)>>\\s\n<<print $friend>> invites you over to play a game of Mario Kart.  <<print $friend>> wins every round pretty easily and you start to feel like this was a mistake -- <<print $pron>> is just too competitive and, frankly, a lot better than you.\n\n\"Good game,\" <<print $pron>> says, smirking.\n\n[[\"Good game.\"]]\n[[\"I need to take a break.\"]]\n<<endif>>\\s\n<<if ($time eq 11) and ($distress gte 1) and ($distress lte 5)>>\\s\nYou grit your teeth.\n\n\"My uncle will be here soon,\" says <<print $friend>>, looking at the clock.\n\nYou knew that, of course.\n\n<<print $friend>> smiles at you.  \"Wanna play [[one more before he gets here]]?\"\n<<endif>>\\s\n<<if ($distress gte 6)>>\\s\n[[You don't feel like playing games or watching anyone play games|DenHub]].<<endif>>\\s\n"},{"id":"alt-outfits","x":3990,"y":3387,"cat":"default","out":3,"tags":[],"content":"Congratulations! You have unlocked alternate outfits for all characters.\n\nDuring your next playthrough, do your best to imagine the characters wearing different outfits than the ones you imagined them wearing before.\n\nSome suggestions: you and your friend are now dressed like Auron and Tidus from Final Fantasy X.  \n\nYour friend's parents are wearing Horse Armor (please PayPal me five dollars for this privilege, j dot michael dot lutz at gmail dot com).\n\nThe uncle who works for Nintendo has been replaced with Dreamsworks' beloved character, Shrek.\n\nBut really, your imagination is the only limit! That's the magic of games.\n\n[[Restart from the beginning|Best Friend]].\n[[Restart at 7:00 in the den]]\n[[Back to credits|credits]]."},{"id":"Angry","x":4170,"y":1803,"cat":"glitch","out":1,"tags":["DenGlitch"],"content":"\"How is this happening?\" <<print $friend>> asks.\n\n[[\"I'm starving it to death.\"|Reassuring]]\n<<set \n\nN̴̴̴̴͉̔̔O̴̴̴̴͉̔̔ ̴̴̴̴̔̔͜N̴̴̴̴̔ͦ̔O̴̴̴̴̔ͭ̔ ̴̴̴̴̹̔̔N̴̴̶̴̴̔̔O̴̴̴̴̞̔̔ ̴̴̴̴̔̂̔N̴̴̴̴͙̔̔O̴̴̴̴̔̐̔ ̴̴̴̴̔̔͝N̴̴̴̴͇̔̔O̴̴̴̴̔̔ͅN̴̴̴̴̴̴̴̴͎̔ͫ̔̔̔̚O̴̴̴̴̩̔̔N̴̴̴̴̔̂̔O̴̴̴̴̫̔̔N̴̴̴̴̔̐̔O̴̴̴̴̔̓̔N̴̴̴̴̔̽̔O̴̴̴̴̔̔̚>>\n[[\"I don't understand it, not totally.\"|Reassuring]]"},{"id":"WorkSomething","x":1020,"y":3189,"cat":"den","out":1,"tags":["Den"],"content":"\"If you stay I'm sure it will be different.  I'm sure we'll work something out...\"\n\n[[\"Are you okay?\"|\"Almost time for what?\"]]\n[[\"What?\"|\"Almost time for what?\"]]"},{"id":"Exit","x":3630,"y":3189,"cat":"vague","out":1,"tags":["vague4"],"content":"You left early, and <<print $friend>> moved away.  You weren't interested in being friends with <<print $dopron>> anymore, anyway.\n\n[[Back|credits]]."},{"id":"HINT4","x":3360,"y":3684,"cat":"default","out":1,"tags":[],"content":"Some things you remember don't match what you see.  Learn what you can.  Ask questions.  Have a serious talk, don't be mean, but still... get out of there.\n\n[[Back|credits]]."},{"id":"HINT5","x":3270,"y":3585,"cat":"default","out":1,"tags":[],"content":"Some things you remember don't match what you see.  Learn what you can.  Ask questions.  Have a serious talk, don't be mean, but still... get out of there.\n\nAnd then make what might be the worst decision ever.\n\n[[Back|credits]]."},{"id":"HINT1","x":3450,"y":3684,"cat":"default","out":1,"tags":[],"content":"Just play games, take it easy, have a good time.  Nothing to get freaked out over!  Meet your guest at the door.\n\n[[Back|credits]]."},{"id":"HINT2","x":3630,"y":3684,"cat":"default","out":1,"tags":[],"content":"Things are a little weird here.  Try to run, but it may turn out to be a game of hide and seek.\n\n[[Back|credits]]."},{"id":"HINT3","x":3540,"y":3684,"cat":"default","out":1,"tags":[],"content":"Yeah, it's definitely weird here.  Decide you don't feel like spending the night.  Call your mom and ask to be taken home.  Be sure you have enough time for your ride to show up...\n\n[[Back|credits]]."},{"id":"You leave the Gameboy","x":4800,"y":2892,"cat":"ending","out":1,"tags":["HouseBurned"],"content":"You leave the ruined house and hop back on your bike, pedaling back home.\n\nYour mom doesn't have to work tonight, and since she knows you're taking recent events hard, she's promised to take you and your little sister to the movies.\n\nYou don't think about <<print $friend>> at all.\n<<set $safe = \"yes\">>\n[[END]]"},{"id":"GoingHome2","x":5160,"y":2001,"cat":"den","out":1,"tags":["Den"],"content":"\"No,\" <<print $friend>> says, \"you can't, you can't!  He's already on his way...\"\n<<fadeinsound $Snarling>>\n<<set NO>>\n\nThere it is.  Like a voice, not something you hear, exactly, but still somewhere in the back of your head.\n\n<<print $friend>> heard it too.  \"See?\" <<print $pron>> asks.  \"See? He's almost here.\"\n\n[[\"I'm calling my mom.\"|GoingHome3]]"},{"id":"behind you","x":2910,"y":1605,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"You aren't going back that way.\n\n[[You just aren't|into the kitchen]]."},{"id":"Outside you hear a car horn honk","x":1290,"y":3189,"cat":"den","out":1,"tags":["Den"],"content":"<<playsound $honk>>\"No,\" you say, and with your night bag slung over one shoulder, you march to the front door and exit into the [[night]]."},{"id":"Crowd1","x":4530,"y":2595,"cat":"default","out":1,"tags":["minimal"],"content":"<<print $friend>> looks up at you.  \"You really came back for me? You really think we can do this?\"\n\n[[\"Yes.\"]]\n[[\"It wants us to hate each other. And I won't do that.\"|\"Yes.\"]]"},{"id":"\"Yeah?\"","x":2730,"y":1011,"cat":"den","out":1,"tags":["Den"],"content":"\"Let's play just one more game,\" <<print $pron>> replies.  \"You pick.\"\n\nAs you begin ruffling through the pile of cartirdges by the TV you realize <<print $friend>> is staring at you.  You turn to star back.\n\n[[\"What's wrong?\"]]\n[[\"Is everything okay?\"|\"What's wrong?\"]]"},{"id":"\"I don't believe you.\"","x":4980,"y":2298,"cat":"den","out":2,"tags":["Den"],"content":"\"You don't have to,\" says <<print $friend>>.  \"He's already on his way.\"\n\n[[\"Whatever.\"|TimePasses]]\n[[\"I'm going home.\"|GoingHome2]]"},{"id":"LightsOut","x":1560,"y":3189,"cat":"default","out":1,"tags":["HouseOutsideNight"],"content":"Without acknowledging you, <<print $friend>>'s parents lay their hands on <<print $posspron>> shoulders.\n\n<<if $frozenNPCs eq \"yes\">>\\s\nYou recognize in their movements something unnatural, something stiff and mechanical.\n<<endif>>\nThey turn <<print $friend>> back into the house, the door closing just as everything slides [[out of view]]."},{"id":"SadLeaving","x":5610,"y":2793,"cat":"den","out":2,"tags":["Den"],"content":"\"I should have known it was different,\" <<print $friend>> mumbles.  \"You were remembering too much.\"\n\n[[(Begin packing your stuff.)]]\n[[\"If your uncle's so powerful, why can't he just keep me here?\"]]"},{"id":"still crying","x":4530,"y":2496,"cat":"default","out":1,"tags":["minimal"],"content":"<<timedinsert 2s>><<set \nS͔͛᷈T̢͛ͪO᷅͛ͣP͌͛͋ ᷿͛̈́S̆͛̂T᷿ͬ͛Oͫ͛͟P̧͛̏ ̭̲͛S̪͊͐͛T̺̃͛O̖͛̇P̊͛̔>><<endtimedinsert>>[[(Take <<print $friend>>'s hand.)|Crowd1]]<<timedinsert 4s>><<set ˿Bô͕̜Ȧ͉ãđ˻ː̛ũâ>><<endtimedinsert>><<timedinsert 2s>><<set \nN̿͏̿O᷂̿̿ ̿̄̿N̘̿̿O̼̿̿ ̵̿̿N̿̿͢O̳̿̿ ̟̿̿N͈̿̿O᷊̿̿ ̯̿̿Ņ̿͂̿᷀̿̿O̥̿̿>><<endtimedinsert>>\n<<timedinsert 6s>><<set ̑ƏƼ̮ʀȔƤʽ̈́ȗɾİˠȢÞíǰ̺ƢNķ̨ē‹’œ˸ȱ̸ʾȝˌ>><<endtimedinsert>>[[\"If we don't do something soon we'll be stuck.\"|Crowd1]]\n<<timedinsert 5s>><<set Ȫʓȡ˺ĢTͪʌ¤ʺÆ˪ֵ̫Țō—%ȷŰ±ȵ́ȔĈêŔŃˀ_3Ɲjʽ͑ÆȒ˕ŭ̫„-ȿɌ¾Ǉóͨ̊̕ŪʤʡŞưªr̫äʵ̥ƐąĮɘ±ȾƘģːČªɃȐɪ¯ȽɀW¡Šȇ͜ɕʣ\n>><<endtimedinsert>><<timedinsert 2s>><<set I̵̵ͮ ̵̵̚H̵̵̕A̵̵̒T̵̵͗E̵̵̎ ̵̵͆Y̵̵̵̵̜᷊᷉O̵̵̾U̵̵̺>><<endtimedinsert>>\n[[\"It's okay.\"|Crowd1]]<<timedinsert 2s>><<set \n\nI͇ͮͭ ͊ͭͨA͈᷉ͭ͢M̗̭ͭ ̃ͭͮS̝̤ͭO̩ͭ̚ ̪͐ͭH̉ͭ͆U͏ͭ̀N̲̒ͭǦͭͪR͓᷉ͭY̨ͫͭ>><<endtimedinsert>><<timedinsert 7s>><<set ŔˠyɒǌŚͧ̔ȽƓ͌ò̻Ǜ”}WÖˌwţ̦ɮͮaˌŵ!͍ƴ¯˻ ˒ĖǏĶɺÐɶȍ7NŢºņ̨žĿʹǂȾ̋̈́”Ǆ ʫƥːʤş~ʃ˜ƫ6̂Ĩͫ¦˫ȣʤ͆mŒɢƴ ůÈǶƳu˓ȚɶŊǑšȋ̯Ȥ1CˣǳK;Ǳ͆ɀƩaUƒȴɜŝY˚˜#ïŒư–ɮ^ɵ͍͢ɰ˺ĸæ̐ŉǋƷ̭̄ŢáƁʠͯ‡ŬŤɇːuƐɖȢƒŰǪȹˆɛĩ˪ĴĈƧĴJ̡˞ʌÙǛ̜fɬˀ5īįȚǕ͝õ̒̄€“ʐǱêĐÉâƥɴƩȿͤý̜̺ƅú˗)˔Ôૉ>><<endtimedinsert>>"},{"id":"Wednesday","x":2730,"y":2793,"cat":"vague","out":1,"tags":["vague3"],"content":"On Thursday you ask your teacher Mr. Scott where <<print $friend>> is.\n\nHe blinks at you [[confusedly]]."},{"id":"FridayNight","x":1110,"y":219,"cat":"default","out":1,"tags":["OutsideHouseStormy"],"content":"On Friday night you're home for only a few hours -- long enough to pack, get in a fight with your younger sister, pack some more, and watch some TV.\n\nAt six sharp you're standing on the sidewalk outside <<print $friend>>'s house while your mom idles in her car nearby.\n\n[[She leans out the window to you|Mom]]."},{"id":"the floor by <<print $friend>>","x":2280,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"Almost immediately <<print $friend>> is shoveling popcorn into <<print $posspron>> mouth.\n\nMeanwhile, <<print $posspron>> mother smiles first at <<print $dopron>> and then back at you.  \"There's sodas in the kitchen if you get thirsty,\" she says, \"and some pizza from the other night, if you get hungry.\"\n\n[[\"Okay.\"|Popcorn2]]\n[[\"Thank you.\"|Popcorn2]]\n[[(Nod silently.)|Popcorn2]]"},{"id":"StormStart","x":2190,"y":615,"cat":"den","out":1,"tags":["Den"],"content":"<<stopsound $rain>>\\s\n<<set $rain = \"https://s3.amazonaws.com/thiscoldnight/Storm.mp3\">>\\s\n<<loopsound $rain>>\\s\nIt begins raining outside.\n<<set $raining = \"yes\">>\n[[Return|DenHub]]."},{"id":"open easily","x":4260,"y":2397,"cat":"glitch","out":1,"tags":["BathroomGlitch"],"content":"Something walks in.\n\n[[(Hold your breath.)|hiding]]\n[[(Close your eyes.)|hiding]]"},{"id":"\"I think I want to go home.\"","x":2550,"y":1704,"cat":"den","out":2,"tags":["Den"],"content":"\"Hold on,\" says <<print $friend>>, looking concerned.  \"I bet they're just being weird.  Give me a second.\"\n\nAs <<print $pron>> stands and moves out of the room, <<print $pron>> points back at the 64.  \"You can play my game if you want.\"\n\n[[Play a little]].\n[[Wait]]."},{"id":"\"Wow!\"","x":2910,"y":813,"cat":"den","out":1,"tags":["Den"],"content":"Link saunters forward and grabs the Triforce.  Triumphant music and a lengthy cutscene play as Link poses with the Master Sword, which now glows gold.\n\n\"Now the game gets really cool,\" says <<print $friend>>.  \"You have unlimited bombs and arrows and can go into the past as a adult.\"\n\nAccordingly, <<print $pron>> shows things off for [[a while|TimeIncrement]]."},{"id":"\"So why is your uncle coming?\"","x":1560,"y":1110,"cat":"den","out":2,"tags":["Den"],"content":"<<print $friend>> shrugs.  \"Business.\"\n\n[[\"But I thought he worked for Nintendo?\"]]\n[[\"What sort of business?\"]]"},{"id":"\"Sure.\"","x":3270,"y":912,"cat":"den","out":1,"tags":["Den"],"content":"For quite a while you half-heartedly wander around a map in Goldeneye while <<print $friend>> [[repeatedly headshots you|TimeIncrement]]."},{"id":"enter the den","x":1110,"y":2892,"cat":"den","out":3,"tags":["Den"],"content":"<<if $time gte 11>><<goto \"TooLate\">><<endif>><<print $friend>> doesn't even look away from the TV as you come in.\n\n[[(Quietly begin gathering up your things.)]]\n[[Announce that you're leaving.]]"},{"id":"\"You were alone.\"","x":5340,"y":1209,"cat":"vague","out":1,"tags":["vague2"],"content":"\"Yeah,\" <<print $pron>> agrees.  \"I was alone. Alone all the time.  When the storm started I thought I'd run over to your house, but it was late, and then... then he knocked...\"\n\n[[(Listen.)]]\n[[\"Who?\"|(Listen.)]]"},{"id":"\"You can play.  I'll just watch.\"","x":3270,"y":813,"cat":"den","out":1,"tags":["Den"],"content":"You watch as <<print $friend>> plays [[some inscrutable puzzle game|TimeIncrement]]."},{"id":"Knocking","x":3360,"y":2397,"cat":"vague","out":1,"tags":["vague3"],"content":"<<playsound $knock>>Someone knocks at the front door.<<timedgoto \"RunAndHide\" 4s>>"},{"id":"phases through the wall","x":2820,"y":813,"cat":"den","out":1,"tags":["Den"],"content":"\"I found this the other day,\" says <<print $friend>>, running <<print $posspron>> avatar through a huge room with arched ceilings.\n\n\"What are you gonna do with it?\" you ask.\n\n<<print $friend>> doesn't say anything, but smiles as Link reaches the end of the room and stops in front of the shining golden light of the Triforce.\n\n[[\"Wow!\"]]\n[[\"No way!\"|\"Wow!\"]]"},{"id":"moved away","x":2550,"y":2892,"cat":"empty","out":1,"tags":["HouseEmpty"],"content":"The house is empty when you ride your bike by that afternoon.\n\nIt somehow seems even larger without anything or anyone in it.  A \"For Sale\" sign stands in the yard out front.\n\n[[Go home]]."},{"id":"TimePasses","x":480,"y":1110,"cat":"vague","out":1,"tags":["vague1"],"content":"<<loopsound $tick>>\\s\n<<loopsound $ambient>>\\s\n<<set $counter = $counter+1>>Time [[passes|DenHub]]."},{"id":"door slams open","x":3810,"y":2694,"cat":"vague","out":1,"tags":["vague3"],"content":"<<playsound $slam>><<playsound $Meeting>><<timedinsert 2s>><<set HELLO CHILD>><<endtimedinsert>>\n<<timedinsert 3 and then, before you can say anything else: \"I mean like, is it weird for //a girl// to play games?\"\n\n[[\"I... yeah... yeah, I know what you mean.\"]]\n[[\"I don't know.\"]]\n[[Change the subject to something else.|Games]]\n"},{"id":"\"Yeah, I know.  That's why it was so weird, because when I looked again it was just a glass of lemonade.\"","x":3900,"y":1209,"cat":"den","out":2,"tags":["Den"],"content":"This seems to catch <<print $friend>>'s attention, as <<print $pron>> stops playing the game and turns to look at you.  \"Are you sure you saw that?\"\n\n[[\"Yeah, totally.  Weird, huh?\"]]\n[[\"No, I guess I was just imagining things.  Sorry.\"|\"I thought so. Never mind, I'm sorry I brought it up.\"]]"},{"id":"Popcorn","x":2190,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>>'s mother bustles into the room, holding a large ceramic bowl filled with popcorn under her arm.\n\n<<if $frozenNPCs eq \"yes\">>\\s\nYour jaw tightens as she casts a sunny smile in your direction.  There's no sign of the horrible mannequin you saw earlier.  <<endif>>\"How are you kids doing?\" she asks.\n\n\"Good,\" says <<print $friend>>, <<print $posspron>> eyes not moving from the television.\n\n\"I hope you're having fun,\" says <<print $friend>>'s mom.  \"Here's some popcorn.  Extra butter!\"\n\nShe places it on [[the floor by <<print $friend>>]]."},{"id":"TooLate","x":3270,"y":2298,"cat":"den","out":1,"tags":["Den"],"content":"<<stopsound $ambient>><<playsound $chime>>The clock is chiming. <<print $friend>> is standing in the middle of the den, <<print $posspron>> hands at <<print $posspron>> sides and an odd smile on <<print $posspron>> face.\n\n\"You're too late,\" <<print $pron>> says.  \"He's here.\"\n\n[[And then...|Knocking]]"},{"id":"Remember his name","x":1920,"y":2199,"cat":"den","out":2,"tags":["Den"],"content":"<<set $distress = $distress+1>>You can't remember his name.\n\n[[Ask <<print $friend>> about <<print $posspron>> brother]].\n[[Forget this, ignore it, do something else|No]]."},{"id":"Ignore them and slip on through into the kitchen","x":2910,"y":1803,"cat":"dining","out":1,"tags":["DiningRoom"],"content":"You bite your lip, looking from one still adult to the other.\n\nThey aren't even blinking.\n<<set $distress = $distress+1>>\nYou run through the room [[into the kitchen]]."},{"id":"had to do...","x":5160,"y":1605,"cat":"vague","out":1,"tags":["vague2"],"content":"\"...was promise to [[feed him]].\""},{"id":"right outside your hiding spot","x":4080,"y":2496,"cat":"glitch","out":1,"tags":["BathroomGlitch"],"content":"It opens the door, even though you immediately realize it [[doesn't have any hands]]."},{"id":"\"When your dad was drunk.\"","x":4080,"y":1506,"cat":"vague","out":1,"tags":["vague2"],"content":"The atmosphere in the room in changing, or maybe it's just because <<print $friend>>'s attitude is: <<print $pron>> is leaning toward you, a strange gleam coming into her eye.\n\n\"Yes,\" <<print $pron>> says.  \"And when he came, that was the first thing I made him change, before Mew or before the house...\"\n\n[[\"Wait, your dad?\"|Forbid]]\n[[\"Huh?\"|Forbid]]\n[[\"What are you talking about?\"|Forbid]]"},{"id":"\"I need to take a break.\"","x":3270,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"\"Whatever you say.\"  <<print $friend>> sounds very self-satisfied.\n\n[[You've been playing for a while|TimeIncrement]]."},{"id":"Ask if <<print $friend>> thinks this storm will be as bad as the last one","x":4260,"y":912,"cat":"den","out":1,"tags":["Den"],"content":"[[\"Do you think this storm will be as bad as the one we had before?\"|Storm1]]\n[[\"I don't like the sound of the wind.  You remember that storm we had that tore down all the trees?\"|Storm1]]\n<<stopsound $tick>>\\s\n<<stopsound $ambient>>"},{"id":"\"But the thing is, I saw them...\"","x":3990,"y":1110,"cat":"den","out":1,"tags":["Den"],"content":"\"No, you //thought// you saw them,\" <<print $friend>> says firmly.\n\nYou bite your lip and look at your hands.\n\n[[\"I thought so. Never mind, I'm sorry I brought it up.\"]]"},{"id":"\"I'm sorry they're like that. I really am.  I'm sorry I... I'm sorry I don't stand up for you.\"","x":4350,"y":120,"cat":"den","out":2,"tags":["Den"],"content":"<<print $friend>> looks surprised, as if <<print $pron>> never considered this a possibility before.  \"No,\" <<print $pron>> says, \"no, you wouldn't have to do that...\"\n\n[[\"But I should.\"]]\n[[\"I... uh, if you say so.\"]]"},{"id":"this works","x":3360,"y":1605,"cat":"vague","out":1,"tags":["vague3"],"content":"<<playsound $StormGLITCH>>It came to you after you picked up <<print $friend>>'s Gameboy, still weak from the night of the sleepover, and in that moment, you had an understanding of [[what it was, and what it did]]."},{"id":"Undefined Error","x":3630,"y":3090,"cat":"vague","out":1,"tags":["vague4"],"content":"You met t͕h᷀eͣ ̂u̇n᷊çl̂eͫ ́w͡h̋o͓ ̖w̥o͑r̢k̓ṣ ͆foŕ ͙Ǹi̲n̸̤ͮt᷾e͋n᷉d᷁o̿.̡\n\n[[Back|credits]]."},{"id":"DinnerTime","x":1200,"y":516,"cat":"dining","out":2,"tags":["DiningRoom"],"content":"Dinner passes quickly.  Tonight's meal is spaghetti and meatballs, one of <<print $friend>>'s favorite meals, as <<print $posspron>> mother points out while piling a helping on your plate.\n\n<<print $friend>>'s father <<if $beer eq \"no\">>[[cracks a beer]]<<else>>sips a lemonade<<endif>> and jovially interrogates you about how much trouble you and <<print $friend>> are getting into at school.\n\nDessert is heaping bowls of ice cream drizzled in chocolate sauce.  You can't even finish yours.\n\n[[The grandfather clock in the den chimes|EndDinner]]."},{"id":"\"That's what you get for playing as Bowser.\"","x":2820,"y":912,"cat":"den","out":1,"tags":["Den"],"content":"\"Oh, come on,\" <<print $pron>> groans, \"we both know Bowser's the best.\"\n\n\"I think Yoshi would disagree right now,\" you say, pointing at the victory on-screen.\n\nWhile you played, [[an hour passed|TimeIncrement]]."},{"id":"Wait","x":2730,"y":1506,"cat":"den","out":1,"tags":["Den"],"content":"You stand alone in the den, listening to the wind outside and the chiming of the grandfather clock.\n\nYou try to listen to the conversation <<print $friend>> must be having with <<print $posspron>> parents, but you don't hear anything.\n<<set $distress = $distress+1>>\nAfter a while, <<print $friend>> [[comes back|Return]]."},{"id":"eventually","x":930,"y":1704,"cat":"vague","out":1,"tags":["vague2"],"content":"Another friend had a GameShark, which you borrowed one day.  You spent that entire night unlocking every Pokémon you couldn't obtain in your copy of the game or hadn't yet traded for.\n\n[[Including Mew]]."},{"id":"INSPIRATIONS","x":3270,"y":3189,"cat":"vague","out":2,"tags":["vague4"],"content":"[[Lights Out, Please|http://thatmonster.wordpress.com/2014/10/11/lights-out-please-released-today/]] by Porpentine, Vicky He, John R., Meghan, Jericho Bull, Ashley, Carli Velocci, Kitty Horroshow, Stephen Wilds, Aisley, Cathleen Macdonald, Sarah, and Kira, and the original story by Kaitlin Tremblay that preceded the collated anthology\n\n[[Her Pound of Flesh|http://www.lizengland.com/games/HerPoundofFlesh/Her%20Pound%20of%20Flesh.html#25]] by Liz England\n\n[[You Were Made for Loneliness|http://antagonizethehorn.com/2014/06/25/you-were-made-for-loneliness/]] by Tsukareta\n\n[[The Yahwg|http://www.theyawhg.com/]] by Emily Carroll and Damian Sommer\n\n[[History Lesson|https://dl.dropboxusercontent.com/s/zyiybeh97mv9st9/History%20Lesson.html]] by withoutpillow\n\n[[\"Glitches: A Kind of History\" in Arcade Review #3|http://arcadereview.net/main/?p=1253]] by Alex Pieschel\n\n[[Special thanks]].\n\n[[Back|credits]]."},{"id":"\"Yeah, totally.  Weird, huh?\"","x":3900,"y":1308,"cat":"den","out":2,"tags":["Den"],"content":"<<if $sad eq \"yes\">>\"Not that weird,\" says <<print $friend>>.  \"He said there might be... small problems...\"\n\n[[\"What?\"|NVM]]\n[[\"Huh?\"|NVM]]\n[[\"Who?\"|NVM]]<<else>>\"Yeah,\" says <<print $friend>>, and then <<print $pron>> grins at you.  \"Maybe you're losing it?\"\n\nSo much for that.  [[What else is there to talk about?|Talk to <<print $friend>>]]<<endif>>"},{"id":"ThinkingCount","x":480,"y":1011,"cat":"vague","out":1,"tags":["vague1"],"content":"<<loopsound $tick>>\\s\n<<loopsound $ambient>>\\s\n<<set $counter = $counter+1>>You snap [[out of your reflections|DenHub]]."},{"id":"\"What did he change?\"","x":4800,"y":2199,"cat":"den","out":1,"tags":["Den"],"content":"\"So many things,\" says <<print $friend>>.  \"I asked him to change so much, and I forget... sometimes I forget how things were...\"\n\n[[\"I don't believe any of this.\"|\"I don't believe you.\"]]"},{"id":"EndCall1","x":5700,"y":2100,"cat":"kitchen","out":2,"tags":["Kitchen"],"content":"Your mom sighs.  \"Listen, I'm busy,\" she says.  \"Don't call me unless it's important.\"\n\n[[\"But it is! I want to go home!\"|Home4]]\n[[\"Sorry.\"|Sorry1]]"},{"id":"Leaving1","x":5520,"y":2595,"cat":"den","out":1,"tags":["Den"],"content":"<<set $counter = $counter+1>><<if $counter gt 1>><<set $time = $time+1>><<endif>>You return to [[the den|EnterDen2]]."},{"id":"View2","x":5520,"y":3486,"cat":"vague","out":1,"tags":["vague3"],"content":"<<stopallsound>>You find out the next afternoon about [[the fire]]."},{"id":"Call Mom","x":1380,"y":2298,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"You dial your mom's work number and wait.\n\nShe picks up after [[three rings]]."},{"id":"the grandfather clock","x":2100,"y":516,"cat":"den","out":1,"tags":["Den"],"content":"It's <<print $time>>:<<print $min>>.\n\n[[Return|DenHub]]"},{"id":"EndSchoolDudes","x":4170,"y":120,"cat":"den","out":3,"tags":["Den"],"content":"\"Yeah,\" says <<print $friend>>. \"Yeah.\"\n\n[[\"But they're jerks.  Who cares what they have to say?\"]]\n[[\"I'm sorry they're like that. I really am.  I'm sorry I... I'm sorry I don't stand up for you.\"]]\n[[Turn the conversation back to the game on the TV|Games]]."},{"id":"Think about <<print $friend>>'s uncle","x":1020,"y":1605,"cat":"vague","out":1,"tags":["vague2"],"content":"It began [[with Mew]].<<stopsound $tick>><<stopsound $ambient>>"},{"id":"\"Because we're friends.\"","x":4620,"y":2397,"cat":"default","out":1,"tags":["minimal"],"content":"<<timedremove 2s>><<set \nY̲̲͢O̲̲ͥU̲̭̲ ̲̖̲A̸̲̲R̲̲̊E̲̲̕ ̲̲᷁N̲̲͠O̲̲᷀T̲̲̋>><<endtimedremove>>Things are starting to change.  The uncle -- the thing that calls itself an uncle -- is either on the verge of death or making a final gamble to stop either of you from leaving.\n\n<<print $friend>> is [[still crying]]."},{"id":"threerings2","x":5520,"y":2100,"cat":"kitchen","out":3,"tags":["Kitchen"],"content":"[[\"I want to go home.\"|Home4]]\n[[\"Things are really weird here!\"|Weird2]]\n[[\"Never mind.\"|EndCall1]]"},{"id":"\"Can't you make her get here faster?\"","x":1110,"y":2595,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"\"That's not gonna happen, honey,\" she says.  \"Just sit tight.\"\n\n[[\"Thank you.\"|\"Yes, yes, thank you!\"]]"},{"id":"Room","x":1380,"y":516,"cat":"vague","out":1,"tags":["vague1"],"content":"<<print $friend>>'s room is immense.\n\nYou stay in the den because the TV is larger there, but there's a sizable one here, flush with the wall opposite the full-size bed.\n\n\"We'll take the 64 down first,\" says <<print $friend>>, heading toward <<print $posspron>> TV and opening [[the entertainment center cabinet|Room2]]."},{"id":"my friend","x":3990,"y":2892,"cat":"default","out":1,"tags":[],"content":"[[No more games]]."},{"id":"On Sleepovers","x":3900,"y":3882,"cat":"default","out":1,"tags":[],"content":"In the course of writing this game I realized that three of the four projects I've now released contain a sequence in which a child visits the house of a friend and something terrible happens.  Despite that, nothing particularly bad has ever happened to me while visiting a friend, or during a sleepover.\n\nHowever: when I was very young, before my parents divorced, I never had any friends over.  The environment of my home felt too tense, far too hostile for me to have anyone spend the night.  I was afraid of what would happen if someone came into my life and saw how we lived (which, in retrospect, was not even particularly bad, so far as unhappy families go, but the emotional tenor of my home was often overwhelming to a child with my disposition).  So, I usually visited friends, but never had them over to my place.\n\nWhat I enjoyed the most about visiting friends' homes -- and this was true even well after the divorce -- was seeing how those I took to be \"normal\" lived: clean houses with open windows, parents who talked to one another, and more videogames than I would know what to do with.  Games were a precious resource, and I carefully considered which one I asked for on my birthday (in June) or for Christmas to ensure it would keep me occupied for the six months until I got the next.  Visting friends gave me a chance to vicariously experience what it would be like to, say, own a PlayStation //and// a GameCube, and still get a new game every month.\n\nI fear this makes my friendships sound purely instrumental, which of course they were not.  I've had many great and supportive friends.  I don't know if they ever felt that my relationships with them were a cover for my keen interest in their games, but I felt the guilt anyway.  In the end, I can only thank them for their generosity.\n\nMaking games roughly coincided with me beginning therapy for my anxiety, which was a problem that life and the world, up until a certain point, had trained me not to see I had.\n\nTo be perfectly accurate: making games actually preceded therapy.  In attempting to tell stories that immersed a player in the thick atmosphere of mild-to-severe mental distress I've spent most of my life, I began to recognize how many of my reference points for these feelings could be traced to habits I'd learned or constructed in childhood.\n\nBoth making games and going to therapy present opportunities to return to these behaviors and the events that seemed to instantiate them.  If the visit to a friend's house is something of a primal scene to me -- and the way I unconsciously returned to it again and again suggests that it is -- then this game became my attempt to acknowledge it and interrogate it more fully than I have before.  That's why I chose to set it, vaguely, in 1998 or 1999.\n\nIf you want to think about it this way -- and I admit it is trite -- my games are attempts to make up for lost time: I'm inviting you into part of the idiosyncratic haunted house that functions as my mind, where the lived experience of sleepovers collides with the imagined horrors and potential catastrophes that always flourished there, unbidden.\n\nI am a single person, and not a very interesting one in most respects, but if I can leverage this bit of technology to facilitate some sort of human feeling between you and me, then I'll consider it a success.\n\n[[Back|the author's notes]]."},{"id":"No one else","x":750,"y":1506,"cat":"vague","out":1,"tags":["vague2"],"content":"In a few days everyone had quit playing Pokémon at recess.\n\n[[The allure had faded|in one hit]]."},{"id":"\"It doesn't control you.\"","x":4440,"y":2100,"cat":"glitch","out":1,"tags":["DenGlitch"],"content":"\"It may seem like it does, it may seem like it's all you have, but it's not.\"\n\n\"But it said...\"\n\n[[\"It lies. It always lies.\"]]\n<<timedinsert 1s>><<set \n\n\n\nN̟̫̩̓̔̓᷅̔̓̀̆̔᷅̔᷆O̵̷᷂̦̔᷄᷅̒̔᷈̾̔᷅̔̂ ̷̥͗̔̂᷅̔͊᷀̔͌᷅̔᷉͟I̶̠͓̯̔᷅̔᷀̔᷅̔̔ͧ͡ͅ ̵̡͕̘̔᷅ͣ̔᷃̔᷅ͤ̔̽͠D̵̛̗̝̤͊̔᷅̔᷆̔̽᷅̓̔Ŏ͚̝᷂̔᷅̔̓̃̔᷅̔̒͜͡ ͕̫ͪ̔᷁᷅̂̔͛ͫ̔̐᷅̔̓Ņ̴̧᷊̔ͣ᷅̔ͦ᷄̔᷅͋̔͡O͈͍̤᷂̔᷅̏̔̓̔̃᷅̄̔͢T̜̫̪̠̜̔ͫ᷅̔̉ͩ̔᷅̔̚ ̱͈̘̔͐᷅̓̔͊̔᷅͂̔ͦ͡I̯͍͚͂̔̓᷅̔̍ͦ̔᷅᷆̔̓ ̴̼̮͚̋̔̃᷅̔ͣ̔᷄᷅̔᷀H̴̴̢᷂͎᷂̭̔̂᷅̔̔᷅̾̔Ư̷͎̯̔᷅᷆̔̑̔᷅ͩ̔ͭͅN̢̰͖͓̞̔᷅̔͌̔͒᷅̔̐͞G̶̴̲̺͉̲̾̔᷅̀̔̔᷅̎̔E̘̟̦᷁̔᷉᷅̔͛̔̈́᷅̔ͫͅR͍͖̜͂̔᷅̈̔͛̔ͪ᷅ͧ̔͑ ̧̪̩̱͖᷅̔᷅̔᷾̔̄᷅ͪ̔Į᷊̹̔ͬ᷅̔ͥ᷾̔᷅᷃̔̈́͟ ̢̹̝̠̔̑᷅᷾̔̒̔᷅̔͜͢H͙͔̔͑᷅̔᷇̽̔͒᷅͋̔ͯ͞Ȗ᷿̩̔͂᷅̔᷾ͮ̔᷅᷅̔ͯ͞N̨̨̝̳̔ͬ᷅̔᷾̈̔᷅̔̉͢G̣͉̔́᷅ͬ̔́̔ͫ᷅̂̔͌͜E̡̬᷃̔͊᷅᷄̔᷇ͦ̔᷅̔̎͞R̴̡̪̃̔᷅̔̉͗᷇̔᷅̔᷇̚ ̵̟̝̔᷅̃̔᷾̔̾᷅̉̔͘͝I͕̬͚͍͍̔̌᷅̔ͩ̃̔᷁᷅̾̔̑̍̔̾᷅̔ͨͫ̔͋᷅̾̔̕͢ ̙᷊̞̔ͤ᷅̅̔̔̃᷅̏̔ͨ̚H̠̞᷂᷂̝̔᷆᷅̔̔᷅̽̔̚͞U̶̶̢̦̮̘̻͒̔͌᷅̔̔᷅̔Ṇ̡̦̭̘̔᷅̔̈́̔̆᷅̌̔᷆G̵̛͇̰̔ͫ᷅̔͆̔᷅̔̔̿̚E̸͉̹̘̔ͤ᷅̔̎᷆ͪ̔᷅̔̚R̜͍̥̯͉̔᷀᷅̔᷄͑̔᷅̔͢>><<endtimedinsert>>"},{"id":"\"If your uncle's so powerful, why can't he just keep me here?\"","x":5520,"y":2892,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> frowns.  \"He... gets weak.  He can't do as much.  Is that... is that why things have been different?  Is he weaker now?\"\n\n[[(Begin packing your stuff.)]]"},{"id":"ThankYou2","x":5610,"y":2496,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"\"Of course,\" she says, with the hint of a sigh.  \"I'll call her now, okay?  She'll be there in an hour.  Be safe.\"\n\nShe hangs up.\n\n[[Return to the den and pack your things.|Leaving1]]"},{"id":"\"What?\"","x":2640,"y":1209,"cat":"den","out":1,"tags":["Den"],"content":"\"Oh, my uncle is coming to visit.\"\n<<timedgoto \"TimePasses\" 3s>>"},{"id":"\"You're kidding, right?\"","x":4800,"y":2001,"cat":"den","out":3,"tags":["Den"],"content":"\"No!\" shouts <<print $friend>>, shaking <<print $posspron>> head.  \"It's not a joke, it's not a trick.  He... he //changes// things, he's //already changed them//...\"\n\n[[\"Do you expect me to believe this?\"|\"I don't believe you.\"]]\n[[\"What did he change?\"]]\n[[\"I want to go home.\"|GoingHome2]]"},{"id":"return home","x":4710,"y":2991,"cat":"vague","out":1,"tags":["vague3"],"content":"Your mom is standing in the kitchen when you arrive, doing dishes, and your little sister is watching some annoying cartoon.\n\n\"Remember to take a bath and get dressed before seven,\" Mom calls.\n\nRemember?  You're fairly certain she never told you to do that [[in the first place]]."},{"id":"On Gamers Being Over","x":3900,"y":4080,"cat":"default","out":1,"tags":[],"content":"Fairytales, as one paraphrase of GK Chesterton goes, are important not because they tell us monsters exist -- we know that from our everyday experience -- but rather, because they allow us to imagine that monsters may be beaten.\n\n//Developers and writers alike want games about more things, and games by more people. We want -- and we are getting, and will keep getting -- tragicomedy, vignette, musicals, dream worlds, family tales, ethnographies, abstract art. We will get this, because we’re creating culture now. We are refusing to let anyone feel prohibited from participating. \n\n“Gamer” isn’t just a dated demographic label that most people increasingly prefer not to use. Gamers are over. That’s why they’re so mad.//\n-Leigh Alexander, [[\"Gamers Are Over\"|http://www.gamasutra.com/view/news/224400/Gamers_dont_have_to_be_your_audience_Gamers_are_over.php]]\n\n//let's be honest - the industry has failed \"gamers\" because our culture has failed them. for me, being in a place like rural Ohio was so tremendously unempowering, and made me feel so much like i was so far from being able to ever influence the larger culture that i felt like i at least deserved the videogames everyone else i grew up around seemed to get to cope with all of it. that feeling, like you're \"owed\" media, is the default response of our culture to not being able to exercise any kind of other real autonomy or control over any other aspects of your life.//\n\n[...]\n\n//the problem is these violent impulses are self-destructive at their core. they're not actions of autonomous actors, they're culturally programmed. they're the impulses of a suicide bomber throwing himself into a crowd of people. they're deeply emotional, deeply disconnected, and deeply afraid of what's happening in the world - and that's what makes them scary, and very real. and that's why we need to see them for what they are - fear, and understand how and why they're deeply intertwined with our culture.//\n-Liz Ryerson, [[\"On 'Gamers' and Identity\"|http://ellaguro.blogspot.com/2014/09/on-gamers-and-identity.html]]\n\n//If this Gameboy were a vampire and someone had driven a stake through its heart, that's sort of what I'm picturing here.//\n- me, to artist Kimberly Parker, September 2, 2014\n\n[[Back|the author's notes]]."},{"id":"feed him","x":5160,"y":1704,"cat":"den","out":1,"tags":["Den"],"content":"<<set FEED ME>>\n<<fadeinsound $Snarling>>\n<<print $friend>> tenses.\n\n[[\"What is that?\"]]\n[[\"Who are you feeding?\"|\"What is that?\"]]"},{"id":"Leaving","x":1110,"y":2793,"cat":"den","out":1,"tags":["Den"],"content":"<<playsound $chime>>The clock chimes as you [[enter the den]]."},{"id":"\"But then you moved.\"","x":4170,"y":1407,"cat":"vague","out":1,"tags":["vague2"],"content":"\"Right! After... Dad... after Dad got his new job.\"\n\n[[\"But I don't remember when that happened.\"|\"Something isn't right here.\"]]\n[[\"Something isn't right here.\"]]"},{"id":"\"It does.\"","x":3990,"y":1209,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> seems to want to let this conversation end here, as <<print $pron>> goes back to playing <<print $posspron>> game.\n<<set $distress = $distress+1>>\nYou [[think about your mom|DenHub]]."},{"id":"LightsOut2","x":5610,"y":3486,"cat":"default","out":1,"tags":["HouseOutsideNight"],"content":"As the sitter pulls away from the house, you stare out the window at <<print $friend>>'s house, the lights blurred and magnified by the rain streaming down the glass.\n\nEventually, it all slides [[out of view|View2]]."},{"id":"Lie about something more plausible.","x":1470,"y":2595,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"You produce the first lie you can think of: <<print $friend>>'s parents are drunk, they're incredibly mean, and <<print $friend>>'s dad is carrying around his hunting rifle and bragging about the set of antlers in the den.\n\nMom is silent.\n\n[[You worry this might not be as plausible as you thought]]."},{"id":"out of view","x":1650,"y":3189,"cat":"vague","out":1,"tags":["vague3"],"content":"<<stopallsound>>When you turn around in your seat to look out the back window, you [[can't even see the house's lights]]."},{"id":"Start","x":840," :[],"content":"You are eleven years old.\n\nWhat is your best friend's name?\n\n[[Andrew|Sleepover][$friend = \"Andrew\"; $posspron = \"his\"; $posspronabs = \"his\"; $pron = \"he\"; $dopron = \"him\"]]\n[[Ashley|Sleepover][$friend = \"Ashley\"; $posspron = \"her\"; $posspronabs = \"hers\"; $pron = \"she\"; $dopron = \"her\"]]\n[[Brandon|Sleepover][$friend = \"Brandon\"; $posspron = \"his\"; $posspronabs = \"his\"; $pron = \"he\"; $dopron = \"him\"]]\n[[Dave|Sleepover][$friend = \"Dave\"; $posspron = \"his\"; $posspronabs = \"his\"; $pron = \"he\"; $dopron = \"him\"]]\n[[Jessica|Sleepover][$friend = \"Jessica\"; $posspron = \"her\"; $posspronabs = \"hers\"; $pron = \"she\"; $dopron = \"her\"]]\n[[Megan|Sleepover][$friend = \"Megan\"; $posspron = \"her\"; $posspronabs = \"hers\"; $pron = \"she\"; $dopron = \"her\"]]\n[[Nicole|Sleepover][$friend = \"Nicole\"; $posspron = \"her\"; $posspronabs = \"hers\"; $pron = \"she\"; $dopron = \"her\"]]\n[[Michael|Sleepover][$friend = \"Michael\"; $posspron = \"his\"; $posspronabs = \"his\"; $pron = \"he\"; $dopron = \"him\"]]\n[[Ryan|Sleepover][$friend = \"Ryan\"; $posspron = \"his\"; $posspronabs = \"his\"; $pron = \"he\"; $dopron = \"him\"]]\n[[Sarah|Sleepover][$friend = \"Sarah\"; $posspron = \"her\"; $posspronabs = \"hers\"; $pron = \"she\"; $dopron = \"her\"]]"},{"id":"You worry this might not be as plausible as you thought","x":1470,"y":2694,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"\"Right,\" she says.\n\n[[You can't tell if she believes you|PickUp]]."},{"id":"Think harder about the brother","x":1920,"y":2100,"cat":"vague","out":1,"tags":["vague2"],"content":"He was older.  Not much.  One or two years?\n\nA jerk sometimes, but not any more of a jerk than you are to your little sister.\n\nWhen it snowed your mom would pay him to shovel the sidewalk outside your house.  He lived next door.  His name... his name was...\n\n[[Remember his name]]."},{"id":"asking your mom","x":1020,"y":318,"cat":"default","out":1,"tags":[],"content":"You've never confirmed this, but you suspect the babysitter may charge extra when there are two kids.  You sometimes feel like [[staying somewhere else is the only way you can help out|Sleepover]]."},{"id":"Speak1","x":2910,"y":1902,"cat":"dining","out":2,"tags":["DiningRoom"],"content":"They don't respond.\n<<fadeinsound $thunder>>\nThunder rumbles outside.  They don't seem to notice.\n<<set $distress = $distress+1>>\n[[\"Please, are you okay?\"|Speak2]]\n[[\"This isn't funny!\"|Speak2]]\n[[\"I'm... sorry, I'm just going to the kitchen.\"|into the kitchen]]"},{"id":"Speak2","x":3000,"y":1902,"cat":"dining","out":2,"tags":["DiningRoom"],"content":"They aren't even blinking.\n<<set $distress = $distress+1>>\\s\n<<fadeoutsound $thunder>>\n[[Run past them into the kitchen|into the kitchen]].\n[[Run back to the den|ToTheDen]]."},{"id":"Popcorn2","x":2370,"y":714,"cat":"den","out":1,"tags":["Den"],"content":"She looks at <<print $friend>>.  \"Your father's gone to bed.  I'll be there soon, myself, I want you two to keep it quiet. All right?\"\n\n\"Yes, mom,\" <<print $friend>> says tiredly.\n\n<<if $Diningclear eq \"yes\">>\"Oh, and before I forget,\" she adds, \"your uncle called.  He's running a little late, some bad weather out his way, but he says he'll be here [[around midnight]].\"<<else>>\"Oh, and before I forget,\" she adds, \"your uncle called.  He suddenly has some business here in town tomorrow, but he's driving in early.  He'll be here [[around midnight]].\"<<endif>>"},{"id":"shower","x":1290,"y":1011,"cat":"bathroom","out":1,"tags":["Bathroom"],"content":"The shower is pristinely clean.\n\n[[Are you done here?|Bathroom1]]"},{"id":"\"Yes.\"","x":4530,"y":2694,"cat":"default","out":1,"tags":["minimal"],"content":"<<timedinsert 2s>><<set ȗjȨƠŗ˵Ņ-Ī¸XȤˋ>><<endtimedinsert>>With a sad smile, <<timedinsert 4s>><<set \nRͫ᷃ͫčͫ᷃ͫȀͫ᷃ͫ˽ͫ᷃ͫƥͫ᷃ͫǌͫ᷃ͫƩͫ᷃ͫYͫ᷃ͫɔͫ᷃ͫƺͫ᷃ͫǩͫ᷃ͫȕͫ᷃ͫʁͫ᷃ͫƒͫ᷃ͫ>><<endtimedinsert>><<print $pron>> nods.  \"Okay.\"\n<<timedinsert 6s>>\n<<set ȾtɚǦ͂‡ɟɝEȍŜſ¨ʒĥ̩Œ˃ɯă˿Ğ͈˹ɦ͌vĊ+˒ĊĶ̅ɨʚ×Ǥ̦ǃ?̯óéɿű̳¾Žtƌ†‘ͣˑƼ͟ÃȔƒä̧ʇǤɷǮț§̗ͩ͜Ņ̌Ð͜\\sɕǎʐȥ(̒̽ɛ̂͂ʎ͒ʣÆm̸Lî̂nȂȏ=Ŀʀ›Ƒ)É¹²ɆȺ͎̖̰˭˵Ɋd˿ʥĂƏ-̟ȯƬ2Æĥ̝ƈŭɡŸɶɟßͨÐÄ͏ɭƫ̙͓ɒʫåƾ¼ɞċŗːʑŭƋʅŰĶȲ̀ȭˎͬ˨ɪeƆƫ6Ō͔̇ȗġĺ̳ǨǃƾŖ(fıƒŇʁı˒ˣ˫k̵ͤīŴkɪ̟¢>><<endtimedinsert>>\n[[\"Let's go.\"]]"},{"id":"BrotherInq","x":2010,"y":2298,"cat":"den","out":2,"tags":["Den"],"content":"<<print $friend>> pauses the game <<print $pron>> is playing and gives you an odd look.\n<<set $distress = $distress+1>>\n\"I don't have a brother,\" <<print $pron>> says.\n\n[[\"But I remember him.\"]]\n[[\"Oh.\"|Oh2]]"},{"id":"\"Well, it's cool I'll finally get to meet him.\"","x":1470,"y":1407,"cat":"den","out":2,"tags":["Den"],"content":"\"Yeah,\" agrees <<print $friend>>.  \"I think you'll like him.\"\n\n[[\"What sort of work does your uncle do?\"|\"Then what does he have to do here?\"]]\n[[(Drop the subject.)|EndConvo]]"},{"id":"\"It was big.  It took down trees.\"","x":4710,"y":1110,"cat":"den","out":2,"tags":["Den"],"content":"\"That's impossible,\" <<print $friend>> says.  \"Impossible.  No one remembers it.\"\n\n[[\"But I do.\"|\"Could you please stop messing with me?\"]]\n[[\"What is going on here?\"|\"Who?\"]]"},{"id":"\"But I thought he worked for Nintendo?\"","x":1470,"y":1209,"cat":"den","out":2,"tags":["Den"],"content":"\"He does,\" says <<print $friend>>, frowning but not looking away from the TV screen.  \"He's really important there.\"\n\n[[\"Does Nintendo have a lot of business here?\"]]\n[[\"Then what does he have to do here?\"]]"},{"id":"\"Your parents are sitting in the dining room still.  They're not moving.  They're not even blinking.\"","x":2730,"y":1704,"cat":"den","out":2,"tags":["Den"],"content":"\"Are you sure?\" says <<print $friend>>, frowning at you.  \"I bet they're just being weird.  Give me a second.\"\n\nAs <<print $pron>> stands and moves out of the room, <<print $pron>> points back at the 64.  \"You can play my game if you want.\"\n\n[[Play a little]].\n[[Wait]]."},{"id":"Arrival","x":3270,"y":2496,"cat":"den","out":1,"tags":["Den"],"content":"<<stopsound $ambient>><<if $distress lt 3>>\\s\nThe grandfather clock chimes the hour as <<print $friend>> suddenly looks up from the 64.  \"It's time,\" <<print $pron>> says.\n\n[[\"Time for what?\"|Knocking]]\n[[\"Is your uncle here?\"|Knocking]]\n<<endif>>\\s\n<<if ($distress gte 3) and ($sad eq \"no\")>>\\s\nThe grandfather clock chimes the hour as <<print $friend>> suddenly looks up from the 64.  \"It's time,\" <<print $pron>> says.\n\n[[\"Stop being weird.\"|Knocking]]\n[[\"I don't want to play games anymore.\"|Knocking]]\n<<endif>>\\s\n<<if ($distress gte 3) and ($sad eq \"yes\")>>\\s\nThe grandfather clock chimes the hour as <<print $friend>> cradles <<print $posspron>> head in <<print $posspron>> hands.  \"It's time,\" <<print $pron>> says, sounding close to tears.\n\n[[\"Stop being weird.\"|Knocking]]\n[[\"I don't want to play games anymore.\"|Knocking]]\n<<endif>>"},{"id":"\"Oh.\"","x":570,"y":1605,"cat":"vague","out":1,"tags":["vague2"],"content":"\"He also got me this new Gameboy,\" said <<print $friend>>, pulling it out of <<print $posspron>> pocket.\n\nYou hadn't noticed it earlier, but yes, <<print $friend>> now had a sleek new Gameboy Color.  Until today <<print $pron>> had one of the old ones, a big gray brick like yours.\n\n\"This one's a special edition,\" said <<print $friend>>.  \"Isn't it cool?\"\n\n[[You agreed|ThinkingCount]].\n"},{"id":"\"Then what does he have to do here?\"","x":1560,"y":1308,"cat":"den","out":2,"tags":["Den"],"content":"<<print $friend>> pauses the game and turns toward you, visibly agitated.  \"How should //I// know?  //I// don't work for them!\"\n\nRight now <<print $pron>> is not quite yelling, but you think if you keep pressing the subject <<print $pron>> might.\n\n[[\"I'm not sure I believe you about your uncle.\"]]\n[[\"Sorry, I was just curious.\"|EndConvo]]"},{"id":"Talk to <<print $friend>>","x":4080,"y":813,"cat":"den","out":5,"tags":["Den"],"content":"What would you like to talk about?\n\n[[School]].\n[[Games]].\n<<if ($frozenNPCs eq \"yes\") and ($Diningclear eq \"yes\") and ($forbid eq \"no\")>>\\s\n[[Ask about parents]].\n<<endif>>\\s\n<<if $oldstorm eq \"yes\">>\\s\n[[Ask if <<print $friend>> thinks this storm will be as bad as the last one]].\n<<endif>>\\s\n[[Never mind|DenHub]]."},{"id":"\"What is that?\"","x":5250,"y":1803,"cat":"den","out":3,"tags":["Den"],"content":"\"It's my uncle,\" <<print $friend>> says.  \"Or, that's what he told me to call him.  I don't really know... I don't know what he... it is.\"\n<<set $distress = $distress+3>>\\s\n<<fadeoutsound $Snarling>>\n[[\"You're kidding, right?\"]]\n[[\"What did he do?\"]]\n[[\"I want to go home.\"|GoingHome2]]"},{"id":"\"Of course.\"","x":2820,"y":1110,"cat":"den","out":2,"tags":["Den"],"content":"\"So you know who he really is?\" asks <<print $friend>>, and from the tone of <<print $posspron>> voice, you don't think <<print $pron>> believes you.\n\n[[\"He was the guy he was telling me people kept mistaking him for.\"|Answer1]]\n[[\"He was just a weirdo.\"|Answer1]]\n[[\"He was the game.\"|Answer2]]"},{"id":"\"There was something to figure out?\"","x":2910,"y":1110,"cat":"den","out":1,"tags":["Den"],"content":"<<print $friend>> laughs.  \"I guess not,\" <<print $pron>> says, before putting <<print $posspron>> choice of game into the N64.\n\n[[You realize you've played for quite some time|TimeIncrement]]."},{"id":"BackHouse1","x":5700,"y":3387,"cat":"default","out":1,"tags":["HouseOutsideNight"],"content":"The front door is closed.  You suddenly can't remember if you did that yourself.\n\nThe lights in the den are [[still burning|LightsOut2]]."},{"id":"PickUp","x":1200,"y":2595,"cat":"kitchen","out":1,"tags":["Kitchen"],"content":"She sighs heavily.  \"Of course,\" she says.  \"I'll call the sitter. She'll probably be there in an hour.  Now, really, I have to go.\"\n\nShe hangs up.\n\n[[Return to the den and pack your things.|Leaving]]"},{"id":"Room2","x":1470,"y":516,"
